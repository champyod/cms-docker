# CMS Worker Stack
# This stack contains worker services for evaluating submissions
# Can be deployed on separate machines and scaled horizontally
# Requires: Core services stack must be accessible

services:
  # CMS Worker - Evaluates submissions in isolated sandboxes
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-worker-${WORKER_SHARD:-0}
    restart: on-failure:5
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: Worker
      # Required for isolate inside docker
      ISOLATE_CGROUP_CONTROL: 1
      # Worker shard - Each worker needs a unique shard number
      WORKER_SHARD: ${WORKER_SHARD:-0}
      # Connection to core services
      CORE_SERVICES_HOST: ${CORE_SERVICES_HOST:-cms-log-service}
      # Worker settings
      KEEP_SANDBOX: ${KEEP_SANDBOX:-false}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-1048576}
      # Worker identification
      WORKER_NAME: ${WORKER_NAME:-worker-${WORKER_SHARD:-0}}
      # Resource limits
      WORKER_MEMORY_LIMIT: ${WORKER_MEMORY_LIMIT:-4G}
      WORKER_CPU_LIMIT: ${WORKER_CPU_LIMIT:-4}
    extra_hosts:
      - "cms-log-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-resource-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-scoring-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-checker-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-evaluation-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-proxy-service:${CORE_SERVICES_HOST:-127.0.0.1}"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
      - cms-data:/var/local/lib/cms
      # Temporary directory for sandboxes
      - worker-tmp:/tmp
      # Mount cgroups for isolate (cgroup v1 and v2)
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "${WORKER_PORT:-26000}:${WORKER_PORT:-26000}"
    networks:
      - cms-network
    privileged: true
    cgroup: host
    # Security options for sandbox isolation
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RESOURCE
      - NET_ADMIN
    command: >
      sh -c "
        set -e
        SHARD=${WORKER_SHARD:-0}
        
        # Create required directories
        sudo mkdir -p /var/local/log/cms/Worker-\$SHARD /var/local/cache/cms /var/local/lib/cms
        sudo chmod -R 777 /var/local/log/cms /var/local/cache/cms /var/local/lib/cms

        # Ensure isolate runtime cgroup config exists
        sudo mkdir -p /run/isolate
        if [ ! -f /run/isolate/cgroup ]; then
          echo '/sys/fs/cgroup' | sudo tee /run/isolate/cgroup >/dev/null
        fi
        sudo chmod 755 /run/isolate
        sudo chmod 644 /run/isolate/cgroup
        
        # Clean up stale isolate cgroups from previous runs
        echo 'Cleaning up stale isolate cgroups...'
        # Try cgroup v2 cleanup
        if [ -f /sys/fs/cgroup/cgroup.subtree_control ]; then
          sudo bash -c 'find /sys/fs/cgroup -name \"isolate\" -type d -exec rmdir {} + 2>/dev/null' || true
        fi
        # Try cgroup v1 cleanup
        for subsys in cpu cpuacct memory pids freezer; do
          [ -d \"/sys/fs/cgroup/$$subsys/isolate\" ] && sudo cgdelete -r \"$$subsys:isolate\" 2>/dev/null || true
        done
        
        # Setup cgroup v2 if available
        if [ -f /sys/fs/cgroup/cgroup.subtree_control ]; then
          echo 'Configuring cgroup v2 controllers...'
          sudo bash -c 'echo +cpu +memory +pids > /sys/fs/cgroup/cgroup.subtree_control' 2>/dev/null || true
        fi
        
        sleep 2
        echo 'Starting worker service...'
        cmsWorker $$SHARD
      "
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-0.5}
          memory: ${WORKER_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${WORKER_CPU_RESERVATION:-0.1}
          memory: ${WORKER_MEMORY_RESERVATION:-256M}
      # Replicas can be scaled based on load
      replicas: ${WORKER_REPLICAS:-1}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsWorker || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  cms-network:
    external: true
    name: cms-network

volumes:
  cms-logs:
    external: true
    name: cms-logs
  cms-cache:
    external: true
    name: cms-cache
  cms-data:
    external: true
    name: cms-data
  worker-tmp:
    name: cms-worker-tmp-${WORKER_SHARD:-0}
