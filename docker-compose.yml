# CMS Docker Compose — unified stack with profiles: core, admin, contest, worker, monitor
# Services orchestrate the Competitive Management System platform

services:

  # PostgreSQL Database
  database:
    image: postgres:15
    container_name: cms-database
    restart: unless-stopped
    profiles:
      - core
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmsdb}
      POSTGRES_USER: ${POSTGRES_USER:-cmsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmspassword}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-md5}
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - cms-database-data:/var/lib/postgresql/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-cmsuser} -d ${POSTGRES_DB:-cmsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # CMS Log Service - Centralized logging
  log-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-log-service
    restart: unless-stopped
    profiles:
      - core
    depends_on:
      database:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: LogService
      SERVICE_SHARD: ${LOG_SERVICE_SHARD:-0}
    ports:
      - "${INNER_IP:-127.0.0.1}:29000:29000"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
    networks:
      - cms-network
    command: >
      sh -c "sudo mkdir -p /var/local/log/cms/LogService-${LOG_SERVICE_SHARD:-0} &&
             sudo chown -R cmsuser:cmsuser /var/local/log/cms &&
             sudo chmod -R 750 /var/local/log/cms &&
             wait-for-it database:5432 -t 60 -- cmsLogService ${LOG_SERVICE_SHARD:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsLogService && python3 -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((socket.gethostbyname(socket.gethostname()), 29000))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # CMS Resource Service - Resource monitoring and management
  resource-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-resource-service
    restart: unless-stopped
    profiles:
      - core
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: ResourceService
      SERVICE_SHARD: ${RESOURCE_SERVICE_SHARD:-0}
    ports:
      - "${INNER_IP:-127.0.0.1}:28000:28000"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
    networks:
      - cms-network
    privileged: true
    command: >
      sh -c "sudo mkdir -p /var/local/log/cms/ResourceService-${RESOURCE_SERVICE_SHARD:-0} &&
             sudo chown -R cmsuser:cmsuser /var/local/log/cms &&
             sudo chmod -R 750 /var/local/log/cms &&
             cmsResourceService ${RESOURCE_SERVICE_SHARD:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsResourceService && python3 -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((socket.gethostbyname(socket.gethostname()), 28000))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # CMS Scoring Service - Handles scoring and ranking
  scoring-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-scoring-service
    restart: unless-stopped
    profiles:
      - core
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: ScoringService
      SERVICE_SHARD: ${SCORING_SERVICE_SHARD:-0}
    ports:
      - "${INNER_IP:-127.0.0.1}:28500:28500"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
      - cms-data:/var/local/lib/cms
    networks:
      - cms-network
    command: >
      sh -c "sudo mkdir -p /var/local/log/cms/ScoringService-${SCORING_SERVICE_SHARD:-0} &&
             sudo chown -R cmsuser:cmsuser /var/local/log/cms &&
             sudo chmod -R 750 /var/local/log/cms &&
             cmsScoringService ${SCORING_SERVICE_SHARD:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsScoringService && python3 -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((socket.gethostbyname(socket.gethostname()), 28500))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # CMS Checker Service - Validates submissions
  checker-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-checker-service
    restart: unless-stopped
    profiles:
      - core
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: Checker
      SERVICE_SHARD: ${CHECKER_SERVICE_SHARD:-0}
    ports:
      - "${INNER_IP:-127.0.0.1}:22000:22000"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
      - cms-data:/var/local/lib/cms
    networks:
      - cms-network
    privileged: true
    command: >
      sh -c "sudo mkdir -p /var/local/log/cms/Checker-${CHECKER_SERVICE_SHARD:-0} &&
             sudo chown -R cmsuser:cmsuser /var/local/log/cms &&
             sudo chmod -R 750 /var/local/log/cms &&
             cmsChecker ${CHECKER_SERVICE_SHARD:-0}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsChecker && python3 -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((socket.gethostbyname(socket.gethostname()), 22000))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # CMS Evaluation Service - Contest scoped evaluation queue
  evaluation-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-evaluation-service
    restart: unless-stopped
    profiles:
      - contest
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: EvaluationService
      SERVICE_SHARD: ${EVALUATION_SERVICE_SHARD:-0}
      CONTEST_ID: ${CONTEST_ID:-1}
    ports:
      - "${INNER_IP:-127.0.0.1}:25000:25000"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
      - cms-data:/var/local/lib/cms
    networks:
      - cms-network
    command: >
      sh -c "sudo mkdir -p /var/local/log/cms/EvaluationService-${EVALUATION_SERVICE_SHARD:-0} &&
             sudo chown -R cmsuser:cmsuser /var/local/log/cms &&
             sudo chmod -R 750 /var/local/log/cms &&
             cmsEvaluationService ${EVALUATION_SERVICE_SHARD:-0} -c ${CONTEST_ID:-1}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsEvaluationService && python3 -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((socket.gethostbyname(socket.gethostname()), 25000))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # CMS Proxy Service - Contest scoped ranking relay
  proxy-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-proxy-service
    restart: unless-stopped
    profiles:
      - contest
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: ProxyService
      SERVICE_SHARD: ${PROXY_SERVICE_SHARD:-0}
      CONTEST_ID: ${CONTEST_ID:-1}
    ports:
      - "${INNER_IP:-127.0.0.1}:28600:28600"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
      - cms-data:/var/local/lib/cms
    networks:
      - cms-network
    command: >
      sh -c "sudo mkdir -p /var/local/log/cms/ProxyService-${PROXY_SERVICE_SHARD:-0} &&
             sudo chown -R cmsuser:cmsuser /var/local/log/cms &&
             sudo chmod -R 750 /var/local/log/cms &&
             cmsProxyService ${PROXY_SERVICE_SHARD:-0} -c ${CONTEST_ID:-1}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsProxyService && python3 -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((socket.gethostbyname(socket.gethostname()), 28600))\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # CMS Contest Web Server - Contestant interface
  contest-web-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-contest-web-server
    # survive daemon/host restarts like every other service; admin-panel
    # lifecycle actions still work (stop/start overrides policy at runtime)
    restart: unless-stopped
    profiles:
      - contest
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: ContestWebServer
      SERVICE_SHARD: ${CONTEST_WEB_SERVER_SHARD:-0}
      CONTEST_ID: ${CONTEST_ID:-1}
      CONTEST_LISTEN_PORT: ${CONTEST_LISTEN_PORT:-8888}
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_DURATION: ${COOKIE_DURATION:-10800}
      MAX_SUBMISSION_LENGTH: ${MAX_SUBMISSION_LENGTH:-100000}
      MAX_INPUT_LENGTH: ${MAX_INPUT_LENGTH:-5000000}
      SUBMIT_LOCAL_COPY: ${SUBMIT_LOCAL_COPY:-true}
      NUM_PROXIES_USED: ${NUM_PROXIES_USED:-1}
      # Adaptive login CAPTCHA for /login, /register and /api/login.
      # __inject_config.sh copies these into [contest_web_server.captcha] of the
      # mounted cms.toml, which is the only config this process can read.
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-0}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_THRESHOLD: ${CAPTCHA_THRESHOLD:-3}
      CAPTCHA_BAN_THRESHOLD: ${CAPTCHA_BAN_THRESHOLD:-5}
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
      - cms-data:/var/local/lib/cms
      - cms-submissions:/var/local/lib/cms/submissions
    networks:
      - cms-network
    ports:
      - "0.0.0.0:${CONTEST_PORT_EXTERNAL:-8888}:${CONTEST_LISTEN_PORT:-8888}"
    privileged: true
    command: >
      sh -c "sudo mkdir -p /var/local/log/cms/ContestWebServer-${CONTEST_WEB_SERVER_SHARD:-0} /var/local/cache/cms /var/local/lib/cms &&
             sudo chown -R cmsuser:cmsuser /var/local/log/cms /var/local/cache/cms /var/local/lib/cms &&
             sudo chmod -R 750 /var/local/log/cms /var/local/cache/cms /var/local/lib/cms &&
             cmsContestWebServer ${CONTEST_WEB_SERVER_SHARD:-0} -c ${CONTEST_ID:-1}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cms-contest.rule=Host(`${CONTEST_DOMAIN:-contest.cms.local}`)"
      - "traefik.http.services.cms-contest.loadbalancer.server.port=${CONTEST_LISTEN_PORT:-8888}"
      - "traefik.http.routers.cms-contest.tls=${ENABLE_TLS:-false}"
      - "traefik.http.routers.cms-contest.tls.certresolver=${TLS_CERTRESOLVER:-letsencrypt}"
    deploy:
      resources:
        limits:
          cpus: ${CONTEST_WEB_CPU_LIMIT:-0.5}
          memory: ${CONTEST_WEB_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${CONTEST_WEB_CPU_RESERVATION:-0.1}
          memory: ${CONTEST_WEB_MEMORY_RESERVATION:-256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CONTEST_LISTEN_PORT:-8888}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Shared store for the login failure counters (LOGIN_RATE_LIMIT_REDIS_*).
  # WHY declared here as well as in docker-compose.domain.yml: `make contest`
  # merges only the base file, so a definition living solely in the domain stack
  # is invisible to it and the contest server counts in process — a lockout then
  # dies with the web server and is per replica. Profiles make the two entries
  # mutually exclusive rather than competing: compose unions profile lists
  # across merged files, so the domain stack (which activates no profile) keeps
  # its own copy and starts exactly one container.
  # WHY `contest` and not every profile: `make core` must not start it.
  redis-rate-limit:
    image: redis:7-alpine
    container_name: grader-redis-rate-limit
    restart: unless-stopped
    profiles:
      - contest
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-rate-limit-data:/data
    networks:
      - cms-network
    # No host ports — reachable only via cms-network as redis-rate-limit:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Optional contest front door (TLS via ENABLE_TLS=true). On its own profile so
  # `make contest` never publishes host 80/443 — start it with `make proxy`, and
  # expose it only by setting NGINX_BIND_IP (the bind model below rebinds 80/443).
  # WHY the plain name: a same-named key as the domain stack's
  # `grader-nginx-proxy` (docker-compose.domain.yml) would merge the two blocks
  # and drop one proxy from the project.
  nginx-proxy:
    image: nginx:alpine
    container_name: cms-nginx-contest
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      contest-web-server:
        condition: service_healthy
      proxy-service:
        condition: service_healthy
      # /ranking/ + funnel proxy into the admin profile; soft so contest-only bring-up skips them.
      ranking-web-server:
        condition: service_healthy
        required: false
      admin-panel-next:
        condition: service_healthy
        required: false
    environment:
      NGINX_HOST: ${CONTEST_DOMAIN:-contest.cms.local}
      CONTEST_LISTEN_PORT: ${CONTEST_LISTEN_PORT:-8888}
      RANKING_LISTEN_PORT: ${RANKING_LISTEN_PORT:-8890}
      RANKING_AUTH_DIRECTIVES: ${RANKING_AUTH_DIRECTIVES:-}
      ENABLE_TLS: ${ENABLE_TLS:-false}
      FUNNEL_ENABLED: ${FUNNEL_ENABLED:-false}
      FUNNEL_REALM: ${FUNNEL_REALM:-CMS restricted}
    volumes:
      - ./config/nginx-contest.conf:/etc/nginx/templates/default.conf.template:ro
      - ./scripts/__nginx-proxy-render.sh:/usr/local/bin/render.sh:ro
      - ./config/funnel.htpasswd:/etc/nginx/funnel.htpasswd:ro
      # Shared webroot so this proxy can answer the HTTP-01 challenge when it owns :80.
      - ./config/letsencrypt/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    networks:
      - cms-network
    ports:
      # Funnel gateways only, loopback by default. Host 80/443 are deliberately not
      # published: exposing this proxy means setting NGINX_BIND_IP, or using the
      # service's own *_PORT_EXTERNAL. The domain stack owns 80/443 for domain users.
      - "${FUNNEL_BIND_IP:-127.0.0.1}:${FUNNEL_PANEL_LISTEN:-8892}:8892"
      - "${FUNNEL_BIND_IP:-127.0.0.1}:${FUNNEL_RANKING_LISTEN:-8893}:8893"
    command: ["/usr/local/bin/render.sh"]


  admin-panel-next:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    image: ghcr.io/champyod/cms-docker-admin-panel:${IMG_TAG:-major-admin-panel}
    container_name: cms-admin-panel-next
    restart: unless-stopped
    profiles:
      - admin
    depends_on:
      database:
        condition: service_healthy
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-0.0.0.0}
      # WHY: single owner role cmsuser owns large objects, so admin panel connects as owner (PostgreSQL restricts large-object access to owner).
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmsuser}:${POSTGRES_PASSWORD:-cmspassword}@database:5432/${POSTGRES_DB:-cmsdb}
      # The console counts login failures in Redis; the panel reads and clears those keys.
      REDIS_URL: redis://${REDIS_HOST:-redis-rate-limit}:${REDIS_PORT:-6379}
      AUTH_SECRET: ${AUTH_SECRET}
      # WHY: the panel speaks the authenticated CMS RPC protocol (cms/io/rpc.py fails closed without it)
      RPC_SECRET: ${RPC_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Adaptive login CAPTCHA
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-0}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_THRESHOLD: ${CAPTCHA_THRESHOLD:-3}
      CAPTCHA_BAN_THRESHOLD: ${CAPTCHA_BAN_THRESHOLD:-5}

      # WHY this is here and not only in config.toml: the panel reads its limits from
      # process.env, and compose is what puts them in the container. Without this line
      # the value reaches .env and stops there, and the panel keeps its built-in
      # default no matter what the operator configures.
      MAX_TESTCASE_UPLOAD_BYTES: ${MAX_TESTCASE_UPLOAD_BYTES:-52428800}

      # Backup destinations the panel offers, and the one preselected. Both were read from
      # process.env by the panel with nothing putting them in the container, so every
      # deployment saw the single implicit default no matter what was configured. Empty
      # means "the one implicit location", which is what the panel already falls back to.
      BACKUP_LOCATIONS: ${BACKUP_LOCATIONS:-}
      BACKUP_DEFAULT_LOCATION: ${BACKUP_DEFAULT_LOCATION:-}
      # WHY the same value the monitor gets: the panel already reads BACKUP_DIR as the
      # fallback when BACKUP_LOCATIONS is empty, and it is given the identical mount so
      # one configured path means one directory in both containers rather than two
      # spellings of the same host folder that can drift apart.
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}

      # WHY the panel receives these: discord-webhook.ts reads them for the alerts the
      # panel sends itself, and compose was the only thing that could have delivered them.
      # They are already [infra] keys, so this needs no new configuration surface.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_ROLE_ID: ${DISCORD_ROLE_ID:-}

      MONITOR_ENHANCED: ${MONITOR_ENHANCED:-0}

      REPO_ROOT: /repo-root
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:-img}
      IS_DOCKER: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo-root
      # WHY this mount exists for BACKUP_DIR to mean one thing: the monitor mounts the
      # archive tree at /app/backups and the panel reads the same BACKUP_DIR. Without the
      # panel holding it too, the value resolves to a directory that is not there and every
      # archive lookup reports an empty tree rather than failing.
      - ./backups:/app/backups
      - cms-logs:/var/local/log/cms
      - cms-ranking-data:/var/local/lib/cms/ranking:rw
      # Read-only: the security surface parses grader-waf's ModSecurity audit log
      # from this shared volume (docker-compose.waf.yml mounts the same one at
      # /var/log inside the WAF). Never mounted read-write, so the panel cannot
      # rewrite the evidence it reports.
      - waf-logs:/var/log/waf:ro
    networks:
      - cms-network
    # WHY: the image runs as the unprivileged node user; this supplementary
    # group (host docker socket gid) is what keeps docker CLI access working.
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "0.0.0.0:${ADMIN_NEXT_PORT_EXTERNAL:-8891}:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cms-admin-next.rule=Host(`${ADMIN_NEXT_DOMAIN:-admin-next.cms.local}`)"
      - "traefik.http.services.cms-admin-next.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # CMS Admin Web Server (Legacy Python Version)
  admin-web-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-admin-web-server
    restart: unless-stopped
    profiles:
      - admin
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      ADMIN_LISTEN_PORT: ${ADMIN_LISTEN_PORT:-8889}
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
    networks:
      - cms-network
    ports:
      - "0.0.0.0:${ADMIN_PORT_EXTERNAL:-8889}:${ADMIN_LISTEN_PORT:-8889}"
    command: ["cmsAdminWebServer"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cms-admin.rule=Host(`${ADMIN_DOMAIN:-admin.cms.local}`)"
      - "traefik.http.services.cms-admin.loadbalancer.server.port=${ADMIN_LISTEN_PORT:-8889}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ADMIN_LISTEN_PORT:-8889}/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Ranking Web Server - Live rankings display
  ranking-web-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: ghcr.io/champyod/cms-docker-core:${IMG_TAG:-major-admin-panel}
    container_name: cms-ranking-web-server
    restart: unless-stopped
    profiles:
      - admin
    depends_on:
      database:
        condition: service_healthy
      log-service:
        condition: service_healthy
    environment:
      # The Rust service reads the projection tables, so it takes the same database
      # URL every other service takes rather than a ranking config file.
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmsuser}:${POSTGRES_PASSWORD:-cmspassword}@database:5432/${POSTGRES_DB:-cmsdb}
      RANKING_BIND_ADDRESS: 0.0.0.0:${RANKING_LISTEN_PORT:-8890}
      # Where the image keeps the vendored page and the licence offer; both are image
      # layout, so they are not operator configuration.
      RANKING_STATIC_DIR: /home/cmsuser/src/src/cmsranking/static
      CMS_CREDITS_FILE: /home/cmsuser/cms/credits.json
      # The panel writes the logo into this volume; the service only reads it, and a
      # path with no extension makes it probe the known image extensions.
      RANKING_LOGO_PATH: /var/local/lib/cms/ranking/logo
      # Signs the console cookie. Empty means the console refuses every login, which
      # is why ./cms config sync generates one.
      RANKING_SESSION_SECRET: ${RANKING_SESSION_SECRET:-}
      # The same Redis the contest login counters use, under a ranking namespace.
      RANKING_REDIS_URL: redis://${LOGIN_RATE_LIMIT_REDIS_HOST:-redis-rate-limit}:${LOGIN_RATE_LIMIT_REDIS_PORT:-6379}
      # Every CAPTCHA key stays in config.toml, as decided; the service only reads them.
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-0}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_THRESHOLD: ${CAPTCHA_THRESHOLD:-3}
    volumes:
      - cms-logs:/var/local/log/cms
      # Kept read-only for the logo: the panel writes it, this service only serves it.
      - cms-ranking-data:/var/local/lib/cms/ranking:ro
    networks:
      - cms-network
    ports:
      - "0.0.0.0:${RANKING_PORT_EXTERNAL:-8890}:${RANKING_LISTEN_PORT:-8890}"
    command: ["cms-ranking"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cms-ranking.rule=Host(`${RANKING_DOMAIN:-ranking.cms.local}`)"
      - "traefik.http.services.cms-ranking.loadbalancer.server.port=${RANKING_LISTEN_PORT:-8890}"
    healthcheck:
      # /healthz, not /: the scoreboard route refuses without a database, and a
      # healthcheck that fails while the service is up is a restart loop.
      test: ["CMD", "curl", "-f", "http://localhost:${RANKING_LISTEN_PORT:-8890}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # CMS Worker - Evaluates submissions in isolated sandboxes
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/champyod/cms-docker-worker:${IMG_TAG:-major-admin-panel}
    container_name: cms-worker-${WORKER_SHARD:-0}
    restart: unless-stopped
    profiles:
      - worker
    environment:
      CMS_CONFIG: ${CMS_CONFIG:-/usr/local/etc/cms.toml}
      SERVICE_TYPE: Worker
      ISOLATE_CGROUP_CONTROL: ${ISOLATE_CGROUP_CONTROL:-1}
      ISOLATE_CGROUP_PATH: ${ISOLATE_CGROUP_PATH:-/sys/fs/cgroup/cms-isolate}
      WORKER_SHARD: ${WORKER_SHARD:-0}
      CORE_SERVICES_HOST: ${CORE_SERVICES_HOST:-cms-log-service}
      KEEP_SANDBOX: ${KEEP_SANDBOX:-false}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-1048576}
      WORKER_NAME: ${WORKER_NAME:-worker-${WORKER_SHARD:-0}}
      WORKER_MEMORY_LIMIT: ${WORKER_MEMORY_LIMIT:-4G}
      WORKER_CPU_LIMIT: ${WORKER_CPU_LIMIT:-4}
      MTLS_WORKERS_ENABLED: ${MTLS_WORKERS_ENABLED:-0}
      MTLS_CA_CERT: ${MTLS_CA_CERT:-config/mtls/ca.pem}
      MTLS_WORKER_CERT: ${MTLS_WORKER_CERT:-config/mtls/worker.pem}
      MTLS_WORKER_KEY: ${MTLS_WORKER_KEY:-config/mtls/worker-key.pem}
    extra_hosts:
      - "cms-log-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-resource-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-scoring-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-checker-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-evaluation-service:${CORE_SERVICES_HOST:-127.0.0.1}"
      - "cms-proxy-service:${CORE_SERVICES_HOST:-127.0.0.1}"
    volumes:
      - ./config/cms.toml:/usr/local/etc/cms.toml:ro
      - cms-logs:/var/local/log/cms
      - cms-cache:/var/local/cache/cms
      - cms-data:/var/local/lib/cms
      - worker-tmp:/tmp
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # mTLS certs (optional, disabled by default — MTLS_WORKERS_ENABLED=0)
      # When MTLS_WORKERS_ENABLED=1, mount CA + worker cert/key; see docs/optional-features.md
      # Paths at MTLS_CA_CERT etc. are optional mounts — container starts without them when disabled.
      # Uncomment to enforce presence: - ${MTLS_CA_CERT:-config/mtls/ca.pem}:/etc/cms/mtls/ca.pem:ro
      # - ${MTLS_WORKER_CERT:-config/mtls/worker.pem}:/etc/cms/mtls/worker.pem:ro
      # - ${MTLS_WORKER_KEY:-config/mtls/worker-key.pem}:/etc/cms/mtls/worker-key.pem:ro
    ports:
      - "${WORKER_BIND_ADDR:-0.0.0.0}:${WORKER_PORT:-26000}:${WORKER_PORT:-26000}"
    networks:
      - cms-network
    privileged: true
    cgroup: host
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RESOURCE
      - NET_ADMIN
    command: >
      sh -lc '
        set -e
        SHARD=${WORKER_SHARD:-0}
        CGROUP_CONTROL=${ISOLATE_CGROUP_CONTROL:-1}

        sudo mkdir -p /var/local/log/cms/Worker-$$SHARD /var/local/cache/cms /var/local/lib/cms &&
        sudo chown -R cmsuser:cmsuser /var/local/log/cms /var/local/cache/cms /var/local/lib/cms &&
        sudo chmod -R 750 /var/local/log/cms /var/local/cache/cms /var/local/lib/cms

        if [ "$$CGROUP_CONTROL" = "1" ]; then
          sudo mkdir -p /run/isolate
          CGROUP_BASE=${ISOLATE_CGROUP_PATH:-/sys/fs/cgroup/cms-isolate}

          if [ ! -d "$$CGROUP_BASE" ]; then
            echo "ISOLATE_CGROUP_PATH missing (cgroupfs is rebuilt on every boot) — recreating $$CGROUP_BASE"
            sudo mkdir -p "$$CGROUP_BASE" 2>/dev/null || true
            sudo chmod 755 "$$CGROUP_BASE" 2>/dev/null || true
            echo "+cpu +memory +pids" | sudo tee "$$CGROUP_BASE/cgroup.subtree_control" >/dev/null 2>&1 || true
          fi

          if [ ! -d "$$CGROUP_BASE" ]; then
            echo "ERROR: ISOLATE_CGROUP_PATH does not exist and could not be created: $$CGROUP_BASE"
            echo "Run scripts/__worker_cgroup_setup.sh on the worker host first."
            exit 1
          fi

          echo "$$CGROUP_BASE" | sudo tee /run/isolate/cgroup >/dev/null
          sudo chmod 755 /run/isolate
          sudo chmod 644 /run/isolate/cgroup

          echo "Attempting to enable cgroup v2 controllers for resource limits..."
          if [ -f "$$CGROUP_BASE/cgroup.subtree_control" ]; then
            echo "+cpu +memory +pids" | sudo tee "$$CGROUP_BASE/cgroup.subtree_control" >/dev/null || true
          fi

          echo "Pre-creating box cgroups for isolate (IDs 0-999)..."
          for box_id in $$(seq 0 999); do
            sudo mkdir -p "$$CGROUP_BASE/box-$$box_id" 2>/dev/null || true
            if [ -d "$$CGROUP_BASE/box-$$box_id" ]; then
              sudo chmod 755 "$$CGROUP_BASE/box-$$box_id" 2>/dev/null || true
            fi
          done
        else
          echo "ISOLATE_CGROUP_CONTROL disabled: starting worker without isolate cgroup mode"
        fi

        echo "Cleaning up stale isolate cgroups (v1)..."
        for subsys in cpu cpuacct memory pids freezer; do
          [ -d "/sys/fs/cgroup/$$subsys/isolate" ] && sudo cgdelete -r "$$subsys:isolate" 2>/dev/null || true
        done

        echo "Worker startup complete. Starting service..."
        exec cmsWorker $$SHARD
      '

    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-0.5}
          memory: ${WORKER_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${WORKER_CPU_RESERVATION:-0.1}
          memory: ${WORKER_MEMORY_RESERVATION:-256M}
      replicas: ${WORKER_REPLICAS:-1}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cmsWorker || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  monitor:
    build:
      context: .
      dockerfile: docker/monitor/Dockerfile
      # WHY: the monitor writes backups through the ./backups bind mount, so the
      # image's runtime uid must match that directory's owner on this host
      # (stat -c %u backups). The default keeps hosts owning uid 1000 unchanged.
      args:
        DOCKER_UID: ${DOCKER_UID:-1000}
    image: ghcr.io/champyod/cms-docker-monitor:${IMG_TAG:-major-admin-panel}
    container_name: cms-monitor
    restart: unless-stopped
    profiles:
      - monitor
    pid: host
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_ROLE_ID=${DISCORD_ROLE_ID}
      # WHY: __monitor.sh resolves config/container-restart.json against REPO_ROOT; without
      # it the mounted file below is never found and per-container policy silently no-ops.
      - REPO_ROOT=/repo-root
      - MONITOR_INTERVAL=5
      - DISK_PATH=/host
      # WHY: the backup path does need database credentials — __monitor.sh itself runs
      # no psql/pg_dump, so there is no DATABASE_URL, but the bind-mounted __backup.sh
      # dumps as cms_backup (BYPASSRLS, the only role that survives FORCE RLS) with
      # PGPASSWORD and then retries as the owner, reading both passwords from the
      # environment. Empty defaults keep the service bootable when they are unset;
      # __backup.sh warns each cycle when a dump credential is missing.
      - POSTGRES_BACKUP_PASSWORD=${POSTGRES_BACKUP_PASSWORD:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - BACKUP_INTERVAL_MINS=${BACKUP_INTERVAL_MINS:-1440}
      - BACKUP_MAX_COUNT=${BACKUP_MAX_COUNT:-50}
      - BACKUP_MAX_AGE_DAYS=${BACKUP_MAX_AGE_DAYS:-10}
      - BACKUP_MAX_SIZE_GB=${BACKUP_MAX_SIZE_GB:-5}
      - BACKUP_DIR=/app/backups
      # Rotation of the cms-logs volume: the CMS services write <epoch>.log files
      # there with no rotation of their own, so the monitor prunes them (age, then
      # oldest-first to the size cap).
      - CMS_LOG_DIR=${CMS_LOG_DIR:-/var/local/log/cms}
      - CMS_LOG_MAX_AGE_DAYS=${CMS_LOG_MAX_AGE_DAYS:-7}
      - CMS_LOG_MAX_SIZE_GB=${CMS_LOG_MAX_SIZE_GB:-5}
      - CMS_LOG_PRUNE_INTERVAL_MINS=${CMS_LOG_PRUNE_INTERVAL_MINS:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro # Mount host root to /host to check disk usage
      - ./backups:/app/backups
      # WHY both scripts are bind-mounted: they are host-side maintenance code that
      # changes between releases, so the running monitor must not lag the checkout
      # (the image copy stays as the fallback).
      - ./scripts/__backup.sh:/usr/local/bin/cms-backup.sh:ro
      - ./scripts/__monitor.sh:/usr/local/bin/monitor.sh:ro
      # WHY the lib is mounted too: cms-backup.sh sources ${SCRIPT_DIR}/__lib/common.sh and
      # SCRIPT_DIR is /usr/local/bin in the container, so the lib has to sit beside the
      # scripts — without this mount the source fails and every backup cycle aborts.
      - ./scripts/__lib:/usr/local/bin/__lib:ro
      - ./config:/repo-root/config:ro # Mount config to read container restart settings
    networks:
      - cms-network

  # Backup Schedule Poller - fires due backup_schedules rows on its own socket
  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile
    image: ghcr.io/champyod/cms-docker-scheduler:${IMG_TAG:-major-admin-panel}
    container_name: cms-scheduler
    restart: unless-stopped
    profiles:
      - monitor
    depends_on:
      database:
        condition: service_healthy
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_ROLE_ID=${DISCORD_ROLE_ID}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cmsuser}:${POSTGRES_PASSWORD:-cmspassword}@database:5432/${POSTGRES_DB:-cmsdb}
      - BACKUP_INTERVAL_MINS=${BACKUP_INTERVAL_MINS:-1440}
      - BACKUP_MAX_COUNT=${BACKUP_MAX_COUNT:-50}
      - BACKUP_MAX_AGE_DAYS=${BACKUP_MAX_AGE_DAYS:-10}
      - BACKUP_MAX_SIZE_GB=${BACKUP_MAX_SIZE_GB:-5}
    volumes:
      # Read-write, unlike cms-monitor: docker exec creates an exec instance in
      # the target container, which the socket refuses when mounted read-only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cms-network

networks:
  cms-network:
    name: cms-network
    driver: bridge

volumes:
  cms-database-data:
    name: cms-database-data
  cms-logs:
    name: cms-logs
  cms-cache:
    name: cms-cache
  cms-data:
    name: cms-data
  # Holds the ranking logo the panel writes, and the host mirror the config sync copies.
  # The JSON store this volume was created for is retired: the proxy writes the projection
  # tables and the service reads them, so nothing here is ranking data any more.
  cms-ranking-data:
    name: cms-ranking-data
  cms-submissions:
    name: cms-submissions-contest
  nginx-cache:
    name: cms-nginx-cache-contest
  nginx-logs:
    name: cms-nginx-logs-contest
  worker-tmp:
    name: cms-worker-tmp-${WORKER_SHARD:-0}
  # Shared with docker-compose.domain.yml's same-named service: both stacks run
  # the one container, so the appendonly data must survive whichever is up.
  redis-rate-limit-data:
    name: cms-redis-rate-limit-data
  # Same key and name as docker-compose.waf.yml's volume, so a merged WAF project
  # sees one volume rather than two that name the same directory.
  waf-logs:
    name: cms-waf-logs
