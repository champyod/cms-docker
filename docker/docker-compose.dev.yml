services:
  devdb:
    image: docker.io/postgres:15@sha256:5a407822929c3789ff5154d3d35bd7e2090318149344c8a3d4ca942b035822ed
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "../.dev/postgres-data:/var/lib/postgresql/data"

  devcms:
    build: ..
    depends_on:
      - "devdb"
    environment:
      CMS_CONFIG: /home/cmsuser/cms/etc/cms-devdb.toml
    volumes:
      - "..:/home/cmsuser/src"
    privileged: true
    command: >
      wait-for-it devdb:5432 -- bash
    ports:
      - 127.0.0.1:8888:8888
      - 127.0.0.1:8889:8889
      - 127.0.0.1:8890:8890
