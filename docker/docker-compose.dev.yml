services:
  devdb:
    image: docker.io/postgres:15@sha256:868b5ee219026c0f34c99d696d4494ccb3705cf1a18bed1e0b9de64d9c011ccd
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "../.dev/postgres-data:/var/lib/postgresql/data"

  devcms:
    build: ..
    depends_on:
      - "devdb"
    environment:
      CMS_CONFIG: /home/cmsuser/cms/etc/cms-devdb.toml
    volumes:
      - "..:/home/cmsuser/src"
    privileged: true
    command: >
      wait-for-it devdb:5432 -- bash
    ports:
      - 127.0.0.1:8888:8888
      - 127.0.0.1:8889:8889
      - 127.0.0.1:8890:8890
