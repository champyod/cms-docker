[package]
name = "sec-digest"
version = "0.1.0"
edition = "2021"
description = "CMS security digest: feeds, ranking, template brief, guarded model chain"
publish = false

[[bin]]
name = "sec-digest"
path = "src/main.rs"

[lib]
name = "sec_digest"
path = "src/lib.rs"

# Six dependencies, each earning its place:
# - serde/serde_json: the feeds are JSON documents and the run record is JSON; the
#   field names must stay identical to the Python payload the LLM stage consumes.
# - ureq: blocking HTTP, because the digest is a cron one-shot and an async runtime
#   would be a scheduler inside a scheduler.
# - regex: every parser here (RSS items, compose image lines, CPE strings) is a
#   direct port of a Python regex; keeping the patterns verbatim is the cheapest
#   way to keep behaviour identical.
# - chrono: the feeds emit RFC3339, RFC2822 and bare dates; the 26h window and the
#   30h scan-staleness rule need real UTC arithmetic.
# - clap: the CLI contract (--no-llm/--print-brief/--dry-run/--window-hours).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
