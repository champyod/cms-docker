[package]
name = "cms-ranking"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
bcrypt = "0.17"
hex = "0.4"
hmac = "0.12"
redis = { version = "0.27", features = ["connection-manager", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["derive", "json", "postgres", "runtime-tokio"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
