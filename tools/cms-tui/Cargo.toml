[package]
name = "cms-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
bollard = "0.16"
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
clap = { version = "4.4", features = ["derive"] }
tui-input = "0.15.4"
throbber-widgets-tui = "0.11.1"

[profile.release]
strip = true
lto = true
