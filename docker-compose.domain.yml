# Domain nginx stack — grader.mwit.ac.th + certbot
# ADDITIVE: does not replace or modify cms-nginx-contest.
# Usage: docker compose -f docker-compose.domain.yml up -d
# Dev note: ports 80/443 may clash with existing nginx-proxy; use
#           DOMAIN_NGINX_HTTP_PORT/DOMAIN_NGINX_HTTPS_PORT overrides.

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: grader-nginx-proxy
    restart: on-failure:5
    depends_on: []
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-grader.mwit.ac.th}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.grader.mwit.ac.th}
      OJ_DOMAIN: ${OJ_DOMAIN:-oj.grader.mwit.ac.th}
      RANKING_DOMAIN: ${RANKING_DOMAIN:-ranking.grader.mwit.ac.th}
      CONTEST_LISTEN_PORT: ${CONTEST_LISTEN_PORT:-8888}
      ADMIN_LISTEN_PORT: ${ADMIN_LISTEN_PORT:-8889}
      RANKING_LISTEN_PORT: ${RANKING_LISTEN_PORT:-8890}
      OJ_BACKEND_PORT: ${OJ_BACKEND_PORT:-9000}
      RANKING_AUTH_DIRECTIVES: ${RANKING_AUTH_DIRECTIVES:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      FUNNEL_REALM: ${FUNNEL_REALM:-CMS restricted}
      FUNNEL_CONTEST_LISTEN: ${FUNNEL_CONTEST_LISTEN:-8443}
      FUNNEL_PANEL_LISTEN: ${FUNNEL_PANEL_LISTEN:-8892}
      FUNNEL_RANKING_LISTEN: ${FUNNEL_RANKING_LISTEN:-8893}
    volumes:
      - ./config/grader.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx-ssl.conf:/etc/nginx/conf.d/nginx-ssl.conf:ro
      - letsencrypt-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    networks:
      - cms-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DOMAIN_NGINX_HTTP_PORT:-80}:80"
      - "${DOMAIN_NGINX_HTTPS_PORT:-443}:443"

  certbot:
    image: certbot/certbot
    container_name: grader-certbot
    restart: on-failure:5
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  letsencrypt-certs:
    name: cms-letsencrypt-certs
  certbot-webroot:
    name: cms-certbot-webroot
  nginx-logs:
    name: cms-nginx-logs-domain

# ── Networks ──────────────────────────────────────────────────────
networks:
  cms-network:
    name: cms-network
    driver: bridge
