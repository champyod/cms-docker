# Domain nginx stack — ADDITIVE: does not replace or modify cms-nginx-contest.
# Usage: docker compose -f docker-compose.domain.yml up -d
# Dev note: ports 80/443 may clash with existing nginx-proxy; use
#           DOMAIN_NGINX_HTTP_PORT/DOMAIN_NGINX_HTTPS_PORT overrides.

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: grader-nginx-proxy
    restart: on-failure:5
    depends_on: []
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      OJ_DOMAIN: ${OJ_DOMAIN}
      RANKING_DOMAIN: ${RANKING_DOMAIN}
      CONTEST_LISTEN_PORT: ${CONTEST_LISTEN_PORT:-8888}
      ADMIN_LISTEN_PORT: ${ADMIN_LISTEN_PORT:-8889}
      RANKING_LISTEN_PORT: ${RANKING_LISTEN_PORT:-8890}
      OJ_BACKEND_PORT: ${OJ_BACKEND_PORT:-9000}
      RANKING_AUTH_DIRECTIVES: ${RANKING_AUTH_DIRECTIVES:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      FUNNEL_REALM: ${FUNNEL_REALM:-CMS restricted}
      FUNNEL_CONTEST_LISTEN: ${FUNNEL_CONTEST_LISTEN:-8443}
      FUNNEL_PANEL_LISTEN: ${FUNNEL_PANEL_LISTEN:-8892}
      FUNNEL_RANKING_LISTEN: ${FUNNEL_RANKING_LISTEN:-8893}
    volumes:
      - ./config/grader.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx-ssl.conf:/etc/nginx/conf.d/nginx-ssl.conf:ro
      - letsencrypt-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    networks:
      - cms-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DOMAIN_NGINX_HTTP_PORT:-80}:80"
      - "${DOMAIN_NGINX_HTTPS_PORT:-443}:443"

  certbot:
    image: certbot/certbot
    container_name: grader-certbot
    restart: on-failure:5
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

  redis-rate-limit:
    image: redis:7-alpine
    container_name: grader-redis-rate-limit
    restart: on-failure:5
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-rate-limit-data:/data
    networks:
      - cms-network
    # No host ports — reachable only via cms-network as redis-rate-limit:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── HSM (optional, profile: hsm) — SoftHSM for dev, YubiHSM for hardware ───
  # Disabled by default (HSM_ENABLED=0). Enable with: HSM_ENABLED=1 docker compose -f docker-compose.domain.yml --profile hsm up -d
  # Or: HSM_ENABLED=1 HSM_MODULE=softhsm ./cms domain setup --apply (certbot uses --hsm with PKCS#11 URI)
  # SoftHSM token DB lives at config/hsm/tokens/* (+ *.db) — gitignored; see .env.infra.example HSM_*.
  # YubiHSM needs host USB passthrough; replace image with yubico/yubihsm and mount /dev/bus/usb.
  # certbot HSM renewal example: certbot certonly --hsm --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-pin "$HSM_PIN" -d "$DOMAIN_NAME"
  hsm:
    image: opencrypto/softhsm
    container_name: grader-hsm
    restart: on-failure:5
    profiles:
      - hsm
    environment:
      SOFTHSM2_CONF: /config/softhsm2.conf
      HSM_PIN: ${HSM_PIN:-}
      HSM_KEY_LABEL: ${HSM_KEY_LABEL:-grader-privkey}
    volumes:
      - ./config/hsm:/config/hsm
      - hsm-data:/var/lib/softhsm/tokens
    networks:
      - cms-network
    # no host ports — accessed via PKCS#11 URI from certbot/nginx only
    healthcheck:
      test: ["CMD-SHELL", "pkcs11-tool --module /usr/lib/softhsm/libsofthsm2.so -L 2>/dev/null | grep -q token || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Vault (optional, profile: vault) — prefer docker-compose.vault.yml if you want isolated file ─
  # Disabled by default (VAULT_ENABLED=0). Enable with: VAULT_ENABLED=1 docker compose --profile vault -f docker-compose.domain.yml up -d
  # Single source of truth is docker-compose.vault.yml — this inline entry mirrors it for convenience.
  # Secrets at VAULT_PATH (secret/cms); token at VAULT_TOKEN — both gitignored via .env.local
  vault-inline:
    image: hashicorp/vault:1.15
    container_name: grader-vault-inline
    restart: on-failure:5
    profiles:
      - vault
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://vault-inline:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_BIND_IP:-127.0.0.1}:${VAULT_PORT:-8200}:8200"
    volumes:
      - vault-data-inline:/vault/data
      - ./config/vault/config.hcl:/vault/config/config.hcl:ro
    networks:
      - cms-network
    command: server -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD-SHELL", "vault status 2>/dev/null | grep -q 'Sealed.*false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  letsencrypt-certs:
    name: cms-letsencrypt-certs
  certbot-webroot:
    name: cms-certbot-webroot
  nginx-logs:
    name: cms-nginx-logs-domain
  redis-rate-limit-data:
    name: cms-redis-rate-limit-data
  hsm-data:
    name: cms-hsm-data
  vault-data-inline:
    name: cms-vault-data-inline

# ── Networks ──────────────────────────────────────────────────────
networks:
  cms-network:
    name: cms-network
    driver: bridge
