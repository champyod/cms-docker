# Domain nginx stack — ${DOMAIN_NAME:-cms.local} + certbot
# ADDITIVE: does not replace or modify cms-nginx-contest.
# Usage: docker compose -f docker-compose.domain.yml up -d
# Dev note: ports 80/443 may clash with the contest `nginx-proxy`; use
#           DOMAIN_NGINX_HTTP_PORT/DOMAIN_NGINX_HTTPS_PORT overrides.
#
# WHY the service is named grader-nginx-proxy rather than nginx-proxy: a merged
# project combines same-named services into one, so a shared `nginx-proxy` key
# meant the domain block silently overrode the contest block (or the reverse,
# depending on -f order) and whichever proxy lost had no entry at all. The name
# matches container_name, so the service and container are addressed identically.
#
# Image pin policy (docs/decisions/image-digest-pinning.md): third-party images carry a
# readable tag plus an @sha256 digest. This file declares no image of our own.

services:
  grader-nginx-proxy:
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    container_name: grader-nginx-proxy
    restart: unless-stopped
    depends_on: []
    # Sign a stand-in cert when the lineage is empty; certbot cannot issue one until nginx serves :80.
    entrypoint: >
      /bin/sh -c 'LINEAGE="$${CERT_LINEAGE_DOMAIN:-}";
      [ -n "$$LINEAGE" ] || LINEAGE="$${DOMAIN_NAME:-}";
      [ -n "$$LINEAGE" ] || LINEAGE="$${ADMIN_DOMAIN:-}";
      [ -n "$$LINEAGE" ] || LINEAGE="$${OJ_DOMAIN:-}";
      [ -n "$$LINEAGE" ] || LINEAGE="$${RANKING_DOMAIN:-}";
      if [ -n "$$LINEAGE" ] && [ ! -f "/etc/letsencrypt/live/$$LINEAGE/fullchain.pem" ]; then
        command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl >/dev/null 2>&1 || true;
        mkdir -p "/etc/letsencrypt/live/$$LINEAGE";
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout "/etc/letsencrypt/live/$$LINEAGE/privkey.pem" -out "/etc/letsencrypt/live/$$LINEAGE/fullchain.pem" -subj "/CN=$$LINEAGE/O=CMS/ST=Bootstrap" 2>/dev/null;
      fi;
      exec nginx -g "daemon off;"'
    environment:
      # WHY empty rather than a .local default: an unset domain must stay unset. A
      # leftover default name becomes a server_name and a SAN for a name nobody
      # requested, which fails ACME validation for the whole certificate. Every one of
      # these is optional; the rendered config carries a vhost only for the ones set.
      DOMAIN_NAME: ${DOMAIN_NAME:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      OJ_DOMAIN: ${OJ_DOMAIN:-}
      RANKING_DOMAIN: ${RANKING_DOMAIN:-}
      # Certbot's lineage name; the entrypoint signs the stand-in certificate here.
      CERT_LINEAGE_DOMAIN: ${CERT_LINEAGE_DOMAIN:-}
      CONTEST_LISTEN_PORT: ${CONTEST_LISTEN_PORT:-8888}
      ADMIN_LISTEN_PORT: ${ADMIN_LISTEN_PORT:-8889}
      RANKING_LISTEN_PORT: ${RANKING_LISTEN_PORT:-8890}
      OJ_BACKEND_PORT: ${OJ_BACKEND_PORT:-9000}
      RANKING_AUTH_DIRECTIVES: ${RANKING_AUTH_DIRECTIVES:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      FUNNEL_REALM: ${FUNNEL_REALM:-CMS restricted}
      FUNNEL_CONTEST_LISTEN: ${FUNNEL_CONTEST_LISTEN:-8443}
      FUNNEL_PANEL_LISTEN: ${FUNNEL_PANEL_LISTEN:-8892}
      FUNNEL_RANKING_LISTEN: ${FUNNEL_RANKING_LISTEN:-8893}
    volumes:
      - ./config/grader.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx-ssl.conf:/etc/nginx/conf.d/nginx-ssl.conf:ro
      # Rendered by ./cms config sync from the service registry. The directory is mounted
      # whole so the glob include in the template has somewhere to look even when empty.
      - ./config/generated:/etc/nginx/generated:ro
      # Host binds rather than named volumes, so the on-host certbot in
      # scripts/__domain.sh writes exactly the tree nginx reads here.
      # Read-write: the entrypoint signs a stand-in certificate here on first start.
      - ./config/letsencrypt:/etc/letsencrypt
      - ./config/letsencrypt/www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    networks:
      - cms-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # WHY: an empty bind default omits the host field, so the engine publishes on
    # its own dual-stack wildcard; naming 0.0.0.0 here would pin IPv4 only.
    ports:
      - "${DOMAIN_NGINX_BIND_IP:-}:${DOMAIN_NGINX_HTTP_PORT:-80}:80"
      - "${DOMAIN_NGINX_BIND_IP:-}:${DOMAIN_NGINX_HTTPS_PORT:-443}:443"

  certbot:
    # For DNS-01 set ACME_CERTBOT_IMAGE=certbot/dns-cloudflare; the webroot default
    # image carries no DNS plugin. The default pins tag+digest: `certbot/certbot` was
    # untagged (implicitly :latest) until the digest-pin pass fixed it to the v5.8.0 tag
    # that :latest resolved to. An override must carry its own tag AND digest.
    image: ${ACME_CERTBOT_IMAGE:-certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20}
    container_name: grader-certbot
    restart: unless-stopped
    environment:
      # WHY empty rather than a .local default: an unset domain must stay unset. A
      # leftover default name becomes a server_name and a SAN for a name nobody
      # requested, which fails ACME validation for the whole certificate. Every one of
      # these is optional; the rendered config carries a vhost only for the ones set.
      DOMAIN_NAME: ${DOMAIN_NAME:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      OJ_DOMAIN: ${OJ_DOMAIN:-}
      RANKING_DOMAIN: ${RANKING_DOMAIN:-}
      # The lineage certbot names the certificate under; empty = derived from the first domain above.
      CERT_LINEAGE_DOMAIN: ${CERT_LINEAGE_DOMAIN:-}
      CERT_EMAIL: ${CERT_EMAIL:-}
      # Empty = HTTP-01 webroot. Set to e.g. cloudflare to issue/renew with DNS-01;
      # the credentials ini is read from /etc/letsencrypt/<provider>.ini.
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-}
      # renew carries no --server: certbot reuses the directory the lineage was issued against.
      ACME_CHALLENGE: ${ACME_CHALLENGE:-}
      ACME_CA: ${ACME_CA:-}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-}
      LE_STAGING: ${LE_STAGING:-}
      # Initial-issuance retry policy. WHY the container needs its own copy: the
      # host script (scripts/__domain.sh) handles --auto-retry/--retry-attempts for
      # an operator-driven run, but this container is the unattended path — nothing
      # re-runs it after a DNS record appears, so a transient failure would leave
      # :443 unserved forever. ATTEMPTS=0 means retry indefinitely; each interval
      # doubles up to RETRY_INTERVAL_CAP, so a slow DNS propagation is not hit with
      # a fixed short loop that then gives up.
      CERT_RETRY_ATTEMPTS: ${CERT_RETRY_ATTEMPTS:-0}
      CERT_RETRY_INTERVAL: ${CERT_RETRY_INTERVAL:-60}
      CERT_RETRY_INTERVAL_CAP: ${CERT_RETRY_INTERVAL_CAP:-600}
    volumes:
      - ./config/letsencrypt:/etc/letsencrypt
      - ./config/letsencrypt/www:/var/www/certbot
    # Bootstrap the first certificate when its lineage is absent, then renew.
    # WHY: `renew` never creates a certificate, so a fresh stack had nothing on
    # :443 until someone ran certonly by hand. CERT_EMAIL must be set for the
    # bootstrap to succeed; otherwise it is skipped and only renewals run.
    # WHY the shell loop builds the -d list instead of passing four flags: every domain
    # is optional, and `certbot certonly -d ""` requests an unnamed SAN, which fails
    # validation for the whole certificate instead of skipping the domain. --cert-name
    # pins the lineage to CERT_LINEAGE_DOMAIN, else the first domain that is set,
    # matching scripts/__domain.sh, so nginx reads the directory certbot writes.
    #
    # WHY the issuance loop classifies failures instead of always retrying: a
    # misconfigured challenge plugin or an unregistered email fails identically on
    # every attempt, so retrying it forever hides a real misconfiguration behind a
    # container that looks busy. Only failures that can succeed on a later attempt
    # (DNS not yet propagated, connection refused, timeout, rate limit) are retried;
    # anything else is reported and the loop stops, leaving the container in a
    # state `certbot-status.sh` and the domain healthcheck can see.
    #
    # WHY a status file rather than only log output: docker logs rotate, and the
    # renewal loop runs forever afterwards. The status file is what
    # scripts/__certbot-status.sh reads to decide whether :443 will ever be
    # served, so the answer survives a restart and does not need log archaeology.
    # NOTE the folded block scalar (`>`) joins each source line with a space before
    # the container's shell ever sees it, so a trailing `#` comment on a line that
    # still carries code would swallow the rest of that line. Comments that describe
    # the script therefore live here in the YAML, not inside the entrypoint string.
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      LINEAGE="$${CERT_LINEAGE_DOMAIN:-$${DOMAIN_NAME:-$${ADMIN_DOMAIN:-$${OJ_DOMAIN:-$${RANKING_DOMAIN}}}}}";
      STATUS=/etc/letsencrypt/certbot-status;
      MODE="http-01";
      CHALLENGE="--webroot -w /var/www/certbot";
      SERVER="";
      if [ -n "$$ACME_DIRECTORY_URL" ]; then SERVER="--server $$ACME_DIRECTORY_URL";
      elif [ "$$ACME_CA" = "letsencrypt-staging" ] || [ "$$LE_STAGING" = "1" ]; then SERVER="--server https://acme-staging-v02.api.letsencrypt.org/directory";
      elif [ "$$ACME_CA" = "zerossl" ]; then SERVER="--server https://acme.zerossl.com/v2/DV90";
      elif [ "$$ACME_CA" = "buypass" ]; then SERVER="--server https://api.buypass.com/acme/directory";
      fi;
      if [ "$$ACME_CHALLENGE" = "tls-alpn-01" ]; then MODE="external";
      elif [ "$$ACME_CHALLENGE" = "dns-01" ]; then
        if [ -n "$$ACME_DNS_PROVIDER" ]; then
          MODE="dns-01";
          CHALLENGE="--dns-$$ACME_DNS_PROVIDER --dns-$$ACME_DNS_PROVIDER-credentials /etc/letsencrypt/$$ACME_DNS_PROVIDER.ini";
        else MODE="dns-01-error";
        fi;
      fi;
      mark() { printf "%s %s\n" "$$1" "$$2" > "$$STATUS"; };
      is_retriable() {
        case "$$1" in
          *"urn:ietf:params:acme:error:dns"*|*"Type: dns"*|*"no valid A records found"*|*"Timeout during connect"*|*"Connection refused"*|*"Invalid response from http://"*|*"urn:ietf:params:acme:error:connection"*|*"urn:ietf:params:acme:error:rateLimited"*|*"too many certificates"*) return 0 ;;
          *) return 1 ;;
        esac;
      };
      if [ -z "$$LINEAGE" ]; then
        echo "no domain configured — set DOMAIN_NAME, ADMIN_DOMAIN, OJ_DOMAIN or RANKING_DOMAIN";
        mark error "no domain configured";
      elif [ -z "$$CERT_EMAIL" ]; then
        echo "CERT_EMAIL is empty — cannot register with Let.s Encrypt; set it in config.toml [core]";
        mark error "CERT_EMAIL empty";
      elif [ "$$MODE" = "external" ]; then
        echo "ACME_CHALLENGE=tls-alpn-01 cannot be answered by certbot, which never shipped TLS-ALPN-01.";
        echo "Renew with ./cms domain renew — it takes host :443 from grader-nginx-proxy for the run.";
        mark external "tls-alpn-01 is host-driven: run ./cms domain renew";
        while :; do sleep 12h & wait $${!}; done;
      elif [ "$$MODE" = "dns-01-error" ]; then
        echo "ACME_CHALLENGE=dns-01 also needs ACME_DNS_PROVIDER (e.g. cloudflare) in config.toml [admin]";
        mark error "ACME_CHALLENGE=dns-01 needs ACME_DNS_PROVIDER";
        while :; do sleep 12h & wait $${!}; done;
      elif [ ! -d "/etc/letsencrypt/live/$$LINEAGE" ]; then
        set --;
        for d in "$$DOMAIN_NAME" "$$ADMIN_DOMAIN" "$$OJ_DOMAIN" "$$RANKING_DOMAIN"; do
          [ -n "$$d" ] && set -- "$$@" -d "$$d";
        done;
        mark pending "attempting issuance for $$LINEAGE";
        attempt=1; interval="$$CERT_RETRY_INTERVAL";
        while :; do
          out=$$(certbot certonly $$CHALLENGE $$SERVER "$$@" --cert-name "$$LINEAGE" --email "$$CERT_EMAIL" --agree-tos --non-interactive 2>&1);
          rc=$$?;
          if [ $$rc -eq 0 ] && [ -d "/etc/letsencrypt/live/$$LINEAGE" ]; then
            mark ok "certificate issued for $$LINEAGE";
            break;
          fi;
          if ! is_retriable "$$out"; then
            echo "certificate issuance failed for a reason retrying cannot fix:";
            echo "$$out";
            mark error "terminal failure for $$LINEAGE — see docker logs grader-certbot";
            break;
          fi;
          if [ "$$CERT_RETRY_ATTEMPTS" -gt 0 ] && [ $$attempt -ge "$$CERT_RETRY_ATTEMPTS" ]; then
            echo "certificate issuance still failing after $$attempt attempt(s):";
            echo "$$out";
            mark error "$$attempt attempts exhausted for $$LINEAGE";
            break;
          fi;
          mark pending "attempt $$attempt failed (retriable) — retrying in $${interval}s";
          echo "attempt $$attempt failed, retrying in $${interval}s";
          sleep "$$interval";
          attempt=$$(( attempt + 1 ));
          interval=$$(( interval * 2 ));
          [ $$interval -gt "$$CERT_RETRY_INTERVAL_CAP" ] && interval="$$CERT_RETRY_INTERVAL_CAP";
        done;
      else
        mark ok "certificate present for $$LINEAGE";
      fi;
      while :; do certbot renew $$CHALLENGE; sleep 12h & wait $${!}; done;'

  redis-rate-limit:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    container_name: grader-redis-rate-limit
    restart: unless-stopped
    # WHY the same service is declared in docker-compose.yml under the `contest`
    # profile: `make contest` merges only the base file, and the login failure
    # counters read this instance, so without a base copy the contest server
    # silently falls back to counting in process. Profiles keep the two entries
    # mutually exclusive — compose unions profile lists across merged files, so
    # this stack (which activates no profile) starts its copy alone.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-rate-limit-data:/data
    networks:
      - cms-network
    # No host ports — reachable only via cms-network as redis-rate-limit:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── HSM (optional) — SoftHSM for dev, YubiHSM for hardware ────────────────
  # WHY there is no `hsm` service here any more: it declared
  # `image: opencrypto/softhsm`, untagged, and that repository does not exist in any
  # registry — `docker pull opencrypto/softhsm` answers "pull access denied …
  # repository does not exist", so there was no digest to resolve and nothing to pin.
  # An untagged name that nobody publishes is also an image-squatting target: whoever
  # registers it gets their code executed with HSM_PIN in the environment and the token
  # DB mounted. An image that cannot be verified must not be declared, so the service is
  # gone rather than exempted from the pin gate (tests/test_image_pins.sh). The decision
  # is recorded in docs/decisions/image-digest-pinning.md.
  #
  # The operator-facing flow is unchanged and still documented (docs/optional-features.md,
  # config.toml.example [infra] HSM_*): HSM_ENABLED=1 HSM_MODULE=softhsm ./cms domain
  # setup --apply, then certbot signs with --hsm. SoftHSM tokens live at
  # config/hsm/tokens/* (+ *.db, gitignored); YubiHSM needs host USB passthrough and a
  # yubico/yubihsm image pinned to tag+digest by the same policy.
  # certbot HSM renewal example: certbot certonly --hsm --hsm-module /usr/lib/softhsm/libsofthsm2.so --hsm-pin "$HSM_PIN" -d "$DOMAIN_NAME"

  # ── Vault (optional, profile: vault) — prefer docker-compose.vault.yml if you want isolated file ─
  # Disabled by default (VAULT_ENABLED=0). Enable with: VAULT_ENABLED=1 docker compose --profile vault -f docker-compose.domain.yml up -d
  # Single source of truth is docker-compose.vault.yml — this inline entry mirrors it for convenience.
  # Secrets at VAULT_PATH (secret/cms); token at VAULT_TOKEN — both gitignored via .env.local
  vault-inline:
    image: hashicorp/vault:1.15@sha256:0450896c43b13879b19442b204ce29dd19b5a10fce43d5cf38af17da20f56f4d
    container_name: grader-vault-inline
    restart: unless-stopped
    profiles:
      - vault
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://vault-inline:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_BIND_IP:-127.0.0.1}:${VAULT_PORT:-8200}:8200"
    volumes:
      - vault-data-inline:/vault/data
      - ./config/vault/config.hcl:/vault/config/config.hcl:ro
    networks:
      - cms-network
    command: server -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD-SHELL", "vault status 2>/dev/null | grep -q 'Sealed.*false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nginx-logs:
    name: cms-nginx-logs-domain
  redis-rate-limit-data:
    name: cms-redis-rate-limit-data
  vault-data-inline:
    name: cms-vault-data-inline

networks:
  cms-network:
    name: cms-network
    driver: bridge
