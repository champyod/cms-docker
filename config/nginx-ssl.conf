# TLS hardening snippet — included by grader.nginx.conf via ssl.conf
# Static config (no envsubst variables); HSTS header is in the main template.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling is decided by the certificate, not by uncommenting this block:
# scripts/__security_headers.sh emits ssl_stapling only when the leaf names an OCSP
# responder, and logs the reason when it does not. Let's Encrypt stopped putting OCSP URLs
# in certificates on 2025-05-07 and retired its responders on 2025-08-06, publishing
# revocation through CRL distribution points, so for those certificates there is nothing to
# staple and these directives would only make nginx log a warning per handshake.

# Security headers (except HSTS, which is in the main template for envsubst)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
