[global]
# Whether to have a backdoor (see doc for the risks).
backdoor = false
# Whether to print debug-level messages into the per-service log file.
file_log_debug = false
# Whether to print more detailed logs on stdout.
stream_log_detailed = false

# Directories used by CMS.
temp_dir = "/tmp"
# Log files. log_dir = "INSTALL_DIR/log" Cached files. cache_dir = "INSTALL_DIR/cache" Miscellaneous files generated by CMS. data_dir = "INSTALL_DIR/lib" Run-time data (e.g. socket files). run_dir = "INSTALL_DIR/run"

[services]
# Each service has some number of shards, defined in this table.

# For each shard of a service, the first element of the list specifies the hostname it will run on, and the second one its port for RPC communication with the rest of CMS.

LogService = [["cms-log-service", 29000]]
ResourceService = [["cms-resource-service", 28000]]
ScoringService = [["cms-scoring-service", 28500]]
Checker = [["cms-checker-service", 22000]]
EvaluationService = [["cms-evaluation-service", 25000]]
# Worker definitions are now managed through the Admin Panel UI Uncomment and modify if you need to manually define workers Worker = [ ["cms-worker-0", 26000], ["cms-worker-1", 26001], ["cms-worker-2", 26002], ["cms-worker-3", 26003], ]
ContestWebServer = [["cms-contest-web-server", 21000]]
AdminWebServer = [["cms-admin-web-server", 21100]]
ProxyService = [["cms-proxy-service", 28600]]
PrometheusExporter = []
TelegramBot = []


[database]
# Connection string for the database.
url = "postgresql+psycopg2://cmsuser:your_password_here@database:5432/cmsdb"

# WHY: classic admin writes use cms_admin_account_security; unset means no fallback and writes fail loudly.

# admin_security_url = "postgresql+psycopg2://cms_admin_account_security:PASSWORD@database:5432/cmsdb"

# Whether SQLAlchemy prints DB queries on stdout.
debug = false

# Whether to use two-phase commit.
twophase_commit = false


[worker]
# Don't delete the sandbox directory under /tmp/ when they are not needed anymore.
keep_sandbox = false


[sandbox]
# Which sandbox implementation to use.
sandbox_implementation = "isolate"
# Do not allow contestants' solutions to write files bigger than this size (expressed in KB; defaults to 1 GB).
max_file_size = 1_048_576

# Max processes, CPU time (s), memory (KiB) for compilation runs.
compilation_sandbox_max_processes = 1000
compilation_sandbox_max_time_s = 10.0
compilation_sandbox_max_memory_kib = 524_288  # 512 MiB
# Max processes, CPU time (s), memory (KiB) for trusted (e.g. checker) runs.
trusted_sandbox_max_processes = 1000
trusted_sandbox_max_time_s = 10.0
trusted_sandbox_max_memory_kib = 4_194_304  # 4 GiB


[web_server]
# This key is used to encode information that can be seen by the user, namely cookies and auto-incremented numbers.
secret_key = "8e045a51e4b102ea803c06f92841a1fb"

# Whether Tornado prints debug information on stdout.
tornado_debug = false


[contest_web_server]
# Listening HTTP addresses and ports for the CWSs listed above in [services].
listen_address = ["127.0.0.1"]
listen_port = [8888]

# Login cookie duration in seconds.
cookie_duration = 10800

# The number of proxies that will be crossed before CWSs get the request.
num_proxies_used = 0

# If CWSs write submissions to disk before storing them in the DB, and where to save them. %s = DATA_DIR.
submit_local_copy = true
submit_local_copy_path = "%s/submissions/"
# Same for user tests.
tests_local_copy = true
tests_local_copy_path = "%s/tests/"

# Maximum size of a submission in bytes.
max_submission_length = 100_000
# Maximum size of an input file for an user test.
max_input_length = 5_000_000

# Path to the documentation exposed by CWS.
docs_path = "/usr/share/cms/docs"

# An authentication token that can be used by the administrator to impersonate an arbitrary user and bypass submit restrictions. contest_admin_token = "CHANGE-ME"

# Adaptive login CAPTCHA for /login, /register and /api/login.
[contest_web_server.captcha]
enabled = false
# Provider priority list; each entry needs its own [contest_web_server.captcha.keys.<name>] table with site_key and secret_key, so the challenge can fall through to the next provider.
providers = []
provider = "turnstile"
site_key = ""
secret_key = ""
threshold = 3
ban_threshold = 5
# Shared store for the login failure counters.
redis_enabled = false
redis_host = "redis-rate-limit"
redis_port = 6379


[admin_web_server]
# Listening HTTP address and port for the AWS.
listen_address = "127.0.0.1"
listen_port = 8889

# Login cookie duration for admins in seconds.
cookie_duration = 36000

# The number of proxies that will be crossed before AWS gets the request.
num_proxies_used = 0

# Adaptive login CAPTCHA, mirroring the Next.js admin panel.
[admin_web_server.captcha]
enabled = false
# Provider priority list; each entry needs its own [admin_web_server.captcha.keys.<name>] table with site_key and secret_key.
providers = []
provider = "turnstile"
site_key = ""
secret_key = ""
threshold = 3
ban_threshold = 5
# Same shared store as the contest server: both verify the same way and count the same failures, so one pair of keys keeps them in step.
redis_enabled = false
redis_host = "redis-rate-limit"
redis_port = 6379


[proxy_service]
# List of URLs (with embedded username and password) of the RWSs where the scores are to be sent.
rankings = ["http://usern4me:passw0rd@cms-ranking-web-server:8890/"]
# If any ranking uses HTTPS, specify a file with the certificates you trust.


[rpc]
# Shared secret for inter-service RPC authentication.

[prometheus]
# Listening HTTP address and port for the exporter.
listen_address = "127.0.0.1"
listen_port = 8811


# Bot token and chat ID for the telegram bot.

