# Brute-force throttle for login endpoints (S2)
limit_req_zone $binary_remote_addr zone=cms_login:10m rate=10r/s;

# WHY no literal container: the panel runs as one of two colours, and which one is live is
# recorded by the swap, not written here. __nginx-proxy-render.sh derives this name from the
# colour through scripts/__admin_panel_target.sh — the same rule the domain route uses.
upstream admin_panel_next {
    server ${ADMIN_PANEL_CONTAINER}:${ADMIN_NEXT_LISTEN_PORT};
}

upstream cms_contest {
    least_conn;
    server cms-contest-web-server:${CONTEST_LISTEN_PORT};
}

# Common proxy hardening + headers, included by both HTTP and HTTPS servers.
# Rendered via envsubst together with the blocks below.
${PROXY_COMMON}

${HTTP_SERVER}

# Funnel gateways (enabled when FUNNEL_ENABLED=true)
${FUNNEL_SERVERS}
