# ModSecurity core configuration — DetectionOnly by default (plan-first, safe rollout)
# Based on OWASP CRS modsecurity.conf-recommended
# See docs/waf-tuning.md for DetectionOnly → On procedure.
# This file is mounted read-only into grader-waf at /etc/modsecurity/modsecurity.conf

# Essential directives
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject

# PCRE limits
SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000

# Audit log — inspect at /var/log/modsec_audit.log inside grader-waf
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

# Debug log (level 0 = off; 3 = verbose; 9 = noisy)
SecDebugLog /var/log/modsec_debug.log
SecDebugLogLevel 0

# Data directory for persistent collections (use /tmp to avoid permission issues)
SecDataDir /tmp

# Allow ModSecurity to access response bodies when enabled (kept Off by default for perf)
# Set to On only if outbound anomaly scoring is needed (ANOMALY_OUTBOUND > 0 already covers headers)

# Connection handling
SecTmpDir /tmp
SecUploadDir /tmp

# Default action for anomaly scoring (CRS)
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Status and error handling
SecStatusEngine On

# Argument / upload limits
SecArgumentSeparator &
SecCookieFormat 0

# Unicode mapping
SecUnicodeMapFile unicode.mapping 20127

# Do not block — DetectionOnly phase produces alerts without enforcement.
# When tuning is complete, switch to:
#   SecRuleEngine On
# and reload: docker compose --profile waf restart grader-waf
