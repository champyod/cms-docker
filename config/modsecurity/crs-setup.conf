# OWASP CRS setup — cms-admin-ui WAF tuning baseline
# Mounted read-only into grader-waf at /etc/modsecurity/crs/crs-setup.conf
# Upstream CRS reference: https://github.com/coreruleset/coreruleset/blob/v4.0.0/crs-setup.conf.example
# All values are overridden by WAF_* env vars via docker-compose.waf.yml when desired.

# --- Paranoia ---
# 1 = default, least false positives (recommended start). 2-4 increase coverage but more FP.
# Contest code with `<script>` / `eval(` / SQL keywords will trip higher paranoia — keep at 1 initially.
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=400"
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"

# --- Anomaly thresholds (anomaly scoring mode) ---
# Inbound: request score must exceed this to block when SecRuleEngine On.
# Outbound: response score threshold (requires SecResponseBodyAccess On).
# Start permissive; tighten after tuning (see docs/waf-tuning.md).
SecAction "id:900100,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5"
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.outbound_anomaly_score_threshold=4"

# --- Anomaly scoring mode ---
# Use `anomaly` (blocking) vs `self-contained` (per-rule). Anomaly scoring is the CRS default.
SecAction "id:900120,phase:1,nolog,pass,t:none,setvar:tx.anomaly_score_blocking=on"

# --- Blocking paranoia level alias (compat) ---
SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=1"

# --- Detection paranoia (log even low-severity) ---
SecAction "id:900210,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=1"

# --- Enforce body access for relevant phases ---
SecAction "id:900220,phase:1,nolog,pass,t:none,setvar:tx.enforce_bodyproc_urlencoded=1"

# --- HTTP policy ---
SecAction "id:900230,phase:1,nolog,pass,t:none,setvar:tx.allowed_methods=GET HEAD POST OPTIONS"
SecAction "id:900240,phase:1,nolog,pass,t:none,setvar:tx.allowed_request_content_type=application/x-www-form-urlencoded|multipart/form-data|text/xml|application/xml|application/soap+xml|application/x-amf|application/json|text/plain"

# --- Allowed HTTP versions ---
SecAction "id:900250,phase:1,nolog,pass,t:none,setvar:tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0"

# --- Restricted extensions / headers (relaxed for CMS file uploads) ---
SecAction "id:900260,phase:1,nolog,pass,t:none,setvar:tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .resources/ .resx/ .sql/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/"
SecAction "id:900270,phase:1,nolog,pass,t:none,setvar:tx.restricted_headers=/proxy/ /lock-token/ /content-range/ /translate/ /if/"

# --- Static resource bypass (reduce FP on css/js/images) ---
SecAction "id:900280,phase:1,nolog,pass,t:none,setvar:tx.static_extensions=/.jpg/ /.jpeg/ /.png/ /.gif/ /.js/ /.css/ /.ico/ /.svg/ /.webp/ /.woff/ /.woff2/ /.ttf/ /.eot/"

# --- CRS tuning notes for this deployment ---
# - Contest submissions contain arbitrary source code (<script>, SELECT, etc.).
#   Expect false positives on /api/submissions, /api/tasks. Whitelist those paths.
#   See docs/waf-tuning.md section 3 for SecRuleUpdateTargetById / SecRuleRemoveById examples.
# - Ranking page is public; keep its threshold permissive or bypass WAF for /ranking/* if needed.
# - CAPTCHA layer (Upgrade-2) stays active alongside WAF — WAF is network hygiene, CAPTCHA is brute-force guard.
# - When WAF_PARANOIA is raised via env, this file's paranoia_level is overridden by PARANOIA env at container start.
