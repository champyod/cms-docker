# CMS Grader fail2ban jail configuration
# Deployed by: scripts/__fail2ban-setup.sh --apply
# Target: /etc/fail2ban/jail.d/grader.conf
#
# Two jails protecting nginx endpoints:
#   1. nginx-http-auth:   brute-force on basic-auth protected paths
#   2. nginx-limit-req:   rate-limit abuse on login endpoints
#
# The nginx proxies log inside their containers, into the named Docker volumes
# cms-nginx-logs-domain and cms-nginx-logs-contest; there is no host
# /var/log/nginx. __NGINX_LOG_GLOB__ is replaced at apply time with those
# volumes' host path (resolved from `docker info`, so a moved Docker root is
# followed). Do not deploy this file verbatim — it is not valid for fail2ban
# until the placeholder is substituted.

[nginx-http-auth]
enabled  = true
port     = http,https
filter   = nginx-http-auth
logpath  = __NGINX_LOG_GLOB__
maxretry = 5
bantime  = 1800
findtime = 300

[nginx-limit-req]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = __NGINX_LOG_GLOB__
maxretry = 10
bantime  = 300
findtime = 300
