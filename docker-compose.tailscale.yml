version: '3.8'

# Tailscale Funnel for CMS Contest
# Provides secure public HTTPS access without domain or public IP
# Usage: docker compose -f docker-compose.yml -f docker-compose.tailscale.yml --env-file .env up -d
# Tailscale settings live in the [tailscale] section of config.toml, rendered into .env by ./cms config sync.

services:
  # Tailscale container with Funnel enabled
  tailscale:
    # Tag+digest: this was `tailscale/tailscale:latest`, which floated. `v1.104.2` is the
    # release that `:latest`/`:stable` resolved to at pin time (identical manifest digest),
    # so the pin changes nothing that runs — it only stops the next upstream push from
    # silently changing it before an operator reviews the Renovate PR.
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: cms-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-cms-contest}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - cms-network
    depends_on:
      - contest-web-server
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cms-network:
    external: true
    name: cms-network

volumes:
  tailscale-state:
    name: tailscale-state
