# WAF stack — OWASP ModSecurity CRS in front of grader-nginx-proxy (optional, disabled by default)
# Plan-first: WAF is available but NOT forced. Enable explicitly when ready.
#
# Disabled by default:
#   WAF_ENABLED=0 (default) — grader-waf container not started, no ports bound, nginx unaffected.
#   CAPTCHA is independent of this file: it is enforced by the login handlers of the
#   admin panel, the admin web server and the contest web server, all gated on
#   CAPTCHA_ENABLED. Turning the WAF on or off changes nothing about it, and both can
#   be on at once. See docs/LOGIN-CAPTCHA.md.
#
# Enable WAF (explicit opt-in):
#   1. Render the nginx config the proxy serves, then start the domain stack:
#        ./cms domain setup --apply
#        make domain
#   2. Start the WAF profile:
#        make waf
#      (equivalently: docker compose -f docker-compose.yml -f docker-compose.domain.yml
#       -f docker-compose.waf.yml --profile core --profile waf up -d)
#      The core profile is required because grader-waf proxies to the domain
#      stack's backends, and the domain stack's TLS proxy is the service
#      `grader-nginx-proxy` (docker-compose.domain.yml) — not the contest
#      `nginx-proxy`, so the contest profile must stay inactive or both proxies
#      would contend for host 80/443.
#   3. Keep SecRuleEngine DetectionOnly for ~1 week, review the audit log, then
#      switch WAF_RULE_ENGINE to On (see docs/waf-tuning.md).
#
# Architecture:
#   grader-waf (OWASP CRS nginx) → grader-nginx-proxy (domain stack nginx) → backends
#   - grader-waf BACKEND=${WAF_BACKEND:-http://grader-nginx-proxy:80} — set it to https://grader-nginx-proxy:<DOMAIN_NGINX_HTTPS_PORT> when the WAF terminates TLS
#   - `grader-nginx-proxy` is the compose *service* name in docker-compose.domain.yml.
#     The contest profile's own proxy is a different service (`nginx-proxy`,
#     container cms-nginx-contest) and is not in this chain.
#   - The container listens on 8080 internally because the image runs unprivileged
#     and refuses to bind below 1024; WAF_PORT (8080 default) is the host-side port.
#   - When WAF_ENABLED=1, expose WAF on host WAF_PORT (default 8080) for testing alongside existing 443.
#     Production wiring (443 → WAF → nginx) requires host port 443 to be re-bound to grader-waf;
#     document both patterns in docs/waf-tuning.md. Default keeps host 443 on grader-nginx-proxy so enabling WAF
#     never breaks existing TLS.
#   - If you want WAF to front 443, set WAF_PORT=443 and change DOMAIN_NGINX_HTTPS_PORT to avoid clash, or
#     bind WAF to 127.0.0.1:${WAF_PORT} and front with host LB. Nothing forces this — user decides.
#
# Backward compatibility:
#   - When WAF_ENABLED=0 (default), this file's service is gated behind profile `waf`; docker compose up without --profile waf ignores grader-waf entirely.
#   - No additional requirement for nginx to start. nginx -t passes with WAF_ENABLED=0 or 1.
#   - Ports are NOT bound when profile not requested, regardless of WAF_ENABLED env.

services:
  grader-waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: grader-waf
    restart: unless-stopped
    profiles:
      - waf
    networks:
      - cms-network
    # Host port is only needed when WAF is active; binding to loopback keeps attack surface minimal.
    # When WAF_ENABLED=0 you do not start this profile, so ports are irrelevant. When WAF_ENABLED=1
    # and profile `waf` is requested, WAF listens on WAF_PORT (8080 default) — change to 443 only
    # when intentionally fronting production traffic (see docs/waf-tuning.md "Wiring" section).
    ports:
      - "${WAF_BIND_IP:-127.0.0.1}:${WAF_PORT:-8080}:8080"
    volumes:
      # WHY these two paths: nginx loads /etc/modsecurity.d/setup.conf, whose
      # Include chain reads /etc/modsecurity.d/modsecurity.conf and
      # /etc/modsecurity.d/owasp-crs/crs-setup.conf (a symlink to /opt/owasp-crs).
      # A file mounted under /etc/modsecurity/ — where this file used to be mounted —
      # is never opened by the server. Verified against a running container: the old
      # mount was present on disk and absent from the loaded configuration.
      #
      # WHY /etc/modsecurity.d/modsecurity.conf is NOT a mount point: entrypoint
      # 90-copy-modsecurity-config.sh copies the generated config over it and exits
      # non-zero on a read-only filesystem, so mounting it :ro stops the container.
      # Instead MODSEC_* variables below set the directives in this file that the
      # deployment actually changes, which is the mechanism the image supports.
      - ./config/modsecurity/crs-setup.conf:/opt/owasp-crs/crs-setup.conf:ro
      # Persist audit logs to host for tuning (mounted volume, not host path dir required at compose parse)
      - waf-logs:/var/log
    environment:
      # PARANOIA / ANOMALY_* are only honoured when MANUAL_MODE is unset, because
      # 95-configure-rules.sh rewrites rules 900000/900110 from them. With the CRS
      # file mounted at its real path and MANUAL_MODE=1, the mounted file is the
      # single source of truth for the CRS knobs and these become inert; they are
      # kept only so `docker compose config` documents the image defaults.
      MANUAL_MODE: "1"
      PARANOIA: ${WAF_PARANOIA:-1}
      ANOMALY_INBOUND: ${WAF_ANOMALY_INBOUND:-5}
      ANOMALY_OUTBOUND: ${WAF_ANOMALY_OUTBOUND:-4}
      # The ModSecurity engine directives that docker-compose.waf.yml tunes live
      # here rather than in a mounted modsecurity.conf, because the image rebuilds
      # that file on every start. This is the supported way to change SecRuleEngine
      # and SecResponseBodyAccess from config.toml.
      MODSEC_RULE_ENGINE: ${WAF_RULE_ENGINE:-DetectionOnly}
      MODSEC_RESP_BODY_ACCESS: ${WAF_RESP_BODY_ACCESS:-Off}
      # Re-point at the proxy's new port once DOMAIN_NGINX_HTTPS_PORT leaves :80, or requests loop.
      BACKEND: ${WAF_BACKEND:-http://grader-nginx-proxy:80}
      BACKEND_WS: ${WAF_BACKEND:-http://grader-nginx-proxy:80}
      PROXY: "1"
      # WHY 8080 and not 80: the image runs as the unprivileged `nginx` user and its
      # 01-check-low-port.sh entrypoint aborts on any PORT below 1024. `PORT: "80"`
      # crash-looped with exit 1 before reaching nginx at all.
      PORT: "8080"
      # The documented name is NGINX_ALWAYS_TLS_REDIRECT. The previous
      # NGINX_ALWAYS_TLS was not a variable this image reads, so the setting was
      # silently ignored.
      NGINX_ALWAYS_TLS_REDIRECT: "off"
      # Expose real IP via X-Forwarded-For passthrough to backend
    depends_on:
      - grader-nginx-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz 2>/dev/null || wget --no-verbose --tries=1 --spider http://localhost:8080/ 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  cms-network:
    name: cms-network
    driver: bridge

volumes:
  waf-logs:
    name: cms-waf-logs
