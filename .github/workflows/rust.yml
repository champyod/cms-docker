name: Rust TUI

on:
  push:
    branches: ["main", "major/admin-panel"]
    paths:
      - 'tools/cms-tui/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: ["main", "major/admin-panel"]
    paths:
      - 'tools/cms-tui/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing else in this repository builds or tests the TUI crate. Every other
# layer has a gate that fails on drift; this one did not, so the command menus,
# module sizes and the launcher contract all regressed without a signal.
jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The crate pins its target to musl in .cargo/config.toml, so the target
      # must exist before any cargo command runs.
      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/cms-tui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/cms-tui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: tools/cms-tui
        run: cargo fmt --check

      - name: Clippy
        working-directory: tools/cms-tui
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: tools/cms-tui
        run: cargo build

      - name: Test
        working-directory: tools/cms-tui
        run: cargo test
