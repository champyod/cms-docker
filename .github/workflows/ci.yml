  # Single required check: passes when every other job succeeded or was skipped.
  gate:
    name: CI
    if: always()
    needs:
      - changes
      - lint
      - gates
      - suites
      - panel
      - container-scan
      - rust
      # rust-ranking was missing here: its failure never reached the required check.
      - rust-ranking
      - deny
      - release-binary
      - build-and-push-core
      - build-and-push-worker
      - build-and-push-admin
      - build-and-push-monitor
      - build-and-push-scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have succeeded or been skipped
        run: |
          declare -A result=(
            [changes]="${{ needs.changes.result }}"
            [lint]="${{ needs.lint.result }}"
            [gates]="${{ needs.gates.result }}"
            [suites]="${{ needs.suites.result }}"
            [panel]="${{ needs.panel.result }}"
            [container-scan]="${{ needs.container-scan.result }}"
            [rust]="${{ needs.rust.result }}"
            [rust-ranking]="${{ needs.rust-ranking.result }}"
            [deny]="${{ needs.deny.result }}"
            [release-binary]="${{ needs.release-binary.result }}"
            [build-and-push-core]="${{ needs.build-and-push-core.result }}"
            [build-and-push-worker]="${{ needs.build-and-push-worker.result }}"
            [build-and-push-admin]="${{ needs.build-and-push-admin.result }}"
            [build-and-push-monitor]="${{ needs.build-and-push-monitor.result }}"
            [build-and-push-scheduler]="${{ needs.build-and-push-scheduler.result }}"
          )
          failed=0
          for job in "${!result[@]}"; do
            outcome="${result[$job]}"
            case "$outcome" in
              success|skipped) ;;
              *) echo "::error::$job did not succeed ($outcome)"; failed=1 ;;
            esac
          done
          if (( failed != 0 )); then
            echo "one or more jobs failed — open the failing job above for the step"
            exit 1
          fi
          echo "all jobs succeeded or were skipped"
