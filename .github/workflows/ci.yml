name: CI

# One workflow for the whole repository, so a push or pull request produces a
# single check run and a single notification while every concern keeps its own
# job for granularity. The triggers below are the union of the workflows this
# replaces, and the parts that used to run on only some events are narrowed
# again with a job-level `if:` — a check job stays off the manual-dispatch path,
# and the image jobs follow the path filters of the `changes` job.
on:
  push:
    branches: ["main", "major/admin-panel"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - '.gitignore'
  pull_request:
    branches: ["main", "major/admin-panel"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      build_arm:
        description: 'Build Worker for ARM (linux/arm64)'
        required: false
        type: boolean
        default: false

# A newer push to the same ref supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      core: ${{ steps.filter.outputs.core }}
      worker: ${{ steps.filter.outputs.worker }}
      admin: ${{ steps.filter.outputs.admin }}
      monitor: ${{ steps.filter.outputs.monitor }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_ranking: ${{ steps.filter.outputs.rust_ranking }}
      rust_backend: ${{ steps.filter.outputs.rust_backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            core:
              - 'Dockerfile'
              - 'src/**'
              - 'constraints.txt'
            worker:
              - 'Dockerfile'
              - 'src/**'
              - 'constraints.txt'
            admin:
              - 'admin-panel/**'
            monitor:
              - 'docker/monitor/**'
              - 'scripts/__monitor.sh'
            scheduler:
              - 'admin-panel/src/scheduler/**'
              - 'admin-panel/src/lib/**'
              - 'admin-panel/prisma/**'
              - 'admin-panel/package.json'
              - 'admin-panel/tsconfig.json'
              - 'docker/scheduler/**'
            rust:
              - 'tools/cms-tui/**'
              - '.tools/cms-tui/**'
              - '.github/workflows/ci.yml'
            rust_ranking:
              - 'ranking-web/**'
              # The advisory policy is a gate on this tree, so editing it must re-run it.
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            # The Rust backend workspace. Absent from this branch today (it lives on
            # the backend feature branch), so this filter is inert until it lands —
            # it must not be dropped, or that workspace arrives with no gate at all.
            rust_backend:
              - 'backend/**'
              - 'deny.toml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint (shell, dockerfile, yaml, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install linters
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint
          shellcheck --version && hadolint --version

      - name: ShellCheck
        run: |
          files=()
          for pattern in 'scripts/*.sh' 'tools/*.sh' 'src/tools/*.sh' 'docker/*.sh' 'src/docker/*.sh' 'tests/*.sh' 'tests/__lib/*.sh' 'tests/fixtures/*'; do
            for f in ${pattern}; do
              [ -f "$f" ] && files+=("$f")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found to lint."
          else
            printf 'Linting:\n'; printf '  %s\n' "${files[@]}"
            shellcheck -S error -x "${files[@]}"
          fi

      - name: hadolint
        run: hadolint Dockerfile docker/monitor/Dockerfile

      - name: yamllint
        run: |
          set -- \
            .yamllint.yml \
            .github/workflows/ \
            .github/dependabot.yml \
            docker-compose*.yml \
            docker/ \
            examples/ \
            src/.readthedocs.yml
          yamllint -c .yamllint.yml "$@"

      - name: Compose config validation
        run: |
          # Generate the env stand-in from the tracked config example
          # (--no-secrets keeps CI logs free of random credentials)
          cp -n config.toml.example config.toml 2>/dev/null || true
          if bash scripts/__config_sync.sh --no-secrets >/dev/null 2>&1 && [ -f .env ]; then
            ENV_ARGS=(--env-file .env)
          else
            echo "config sync failed; using dummy env vars"
            export POSTGRES_PASSWORD=x AUTH_SECRET=x SECRET_KEY=x CONTEST_ID=1
            ENV_ARGS=()
          fi
          # Overlay stacks reference services from a base stack
          # (e.g. docker-compose.tailscale.yml depends on contest-web-server
          # from docker-compose.yml), so they must be validated
          # merged with their base instead of standalone.
          declare -A OVERLAY_BASE=(
            [docker-compose.tailscale.yml]=docker-compose.yml
            [docker-compose.waf.yml]=docker-compose.domain.yml
            # The security overlay only adds `diun.enable` labels to base services; validated
            # standalone those services would have no image, so merge with the base stack.
            [docker-compose.security.yml]=docker-compose.yml
          )
          # An overlay whose target is profile-gated has to enable those profiles, or
          # compose reports the gated service as undefined instead of validating it.
          declare -A OVERLAY_PROFILES=(
            [docker-compose.tailscale.yml]="--profile core --profile contest"
            [docker-compose.security.yml]="--profile security"
          )
          for f in docker-compose*.yml docker/docker-compose*.yml; do
            [ -f "$f" ] || continue
            if [ -n "${OVERLAY_BASE[$f]:-}" ]; then
              base="${OVERLAY_BASE[$f]}"
              profiles="${OVERLAY_PROFILES[$f]:-}"
              echo "::group::docker compose config -q -- $base + $f"
              if [ "${#ENV_ARGS[@]}" -gt 0 ]; then
                docker compose "${ENV_ARGS[@]}" -f "$base" -f "$f" $profiles config -q
              else
                docker compose -f "$base" -f "$f" $profiles config -q
              fi
            else
              echo "::group::docker compose config -q -- $f"
              if [ "${#ENV_ARGS[@]}" -gt 0 ]; then
                docker compose "${ENV_ARGS[@]}" -f "$f" config -q
              else
                docker compose -f "$f" config -q
              fi
            fi
            echo "::endgroup::"
          done

  # WHY a separate job: these gates read files the image build never looks at
  # (admin-panel/prisma/schema.prisma and sql/, the permission registry, and the
  # server actions and route handlers), so a panel-only change must still
  # validate permission, audit and RLS coverage plus generator freshness.
  gates:
    name: Gates (spec parity, audit, permissions, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: VAR_SPEC parity
        run: bash scripts/__check_spec_parity.sh

      - name: Variable coverage
        run: bash scripts/__check_var_coverage.sh

      - name: Audit coverage
        run: bash scripts/__check_audit_coverage.sh

      - name: Permission parity
        run: bash scripts/__check_permission_parity.sh

      - name: RLS coverage
        run: bash scripts/__check_rls_coverage.sh

      - name: RLS SQL freshness
        run: bash scripts/__generate_rls_sql.sh --check

  # Runs the repo suites, which nothing else does; they need a checkout, not a stack.
  suites:
    name: Suites (repo tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The harness fails (not skips) when a tool it stages is missing.
      - name: Install suite prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # The proxy-body-size suite imports the panel's testcase limits via `bun -e`.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Needs DISK_FLOOR_GB free outside the checkout for its scratch tree.
      - name: Run the repo suites
        run: make test

  # WHY a separate job: nothing else type-checks or tests the admin panel, so a
  # type error or a failing unit test could reach main unnoticed. The secret
  # scan rides here because it needs the full history this job already checks
  # out.
  panel:
    name: Admin panel (types, tests, deps, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The secret scan diffs the commits of this event, which needs them
          # present locally instead of a single-commit shallow clone.
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: admin-panel
        run: bun install --frozen-lockfile

      # WHY: the Prisma client is generated code and is not committed, so a clean
      # checkout has no model types. Without this, every callback parameter infers
      # as `any` and `@prisma/client` exports no `Prisma` namespace, producing a
      # wall of type errors that say nothing about the change under review.
      - name: Generate Prisma client
        working-directory: admin-panel
        run: bunx prisma generate

      - name: Lint (eslint)
        working-directory: admin-panel
        run: bun run lint

      - name: Type check
        working-directory: admin-panel
        run: bunx tsc --noEmit

      - name: Test
        working-directory: admin-panel
        run: bun run test

      # WHY: the served favicons and logos are committed copies of brand/, so drift needs its own gate.
      - name: Brand drift
        working-directory: admin-panel
        run: bun run icons:check

      # WHY blocking now: the tree audits clean at high/critical except
      # braces@3.0.3 (GHSA-vfj7-8cjw-p6xm) — no fixed release exists, and the
      # package sits only in the eslint glob chain (fast-glob > micromatch),
      # never in the standalone production bundle. The ignore keeps that one
      # visible in the log while every NEW advisory fails the run.
      - name: Dependency audit
        working-directory: admin-panel
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings land in the log and job summary, so the job needs no write scopes.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # WHY: the image jobs build and push but never inspect what ships — OS package
  # CVEs in the base image and Dockerfile misconfigurations (root user, secrets
  # baked into layers) only surface once someone pulls and runs the image.
  container-scan:
    name: Trivy (image CVEs, Dockerfile misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Plain docker build (not buildx) so the image lands in the local daemon
      # where trivy can read it.
      - name: Build admin panel image
        run: docker build -t cms-admin-panel:scan ./admin-panel

      # ignore-unfixed: base-image packages with no released fix would fail
      # every run forever; exit-code 1 makes real, fixable CRITICAL/HIGH fail.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cms-admin-panel:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          exit-code: "1"

      # CRITICAL only: hadolint (lint job) already owns style-level Dockerfile
      # findings, and misconfig severity mappings are the noisiest part of
      # trivy config — fail only on what would leak or escalate outright.
      - name: Trivy Dockerfile/compose misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  # WHY: nothing else in this repository builds or tests the TUI crate. Every
  # other layer has a gate that fails on drift; this one did not, so the command
  # menus, module sizes and the launcher contract all regressed without a signal.
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The crate pins its target to musl in .cargo/config.toml, so the target
      # must exist before any cargo command runs.
      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/cms-tui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/cms-tui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: tools/cms-tui
        run: cargo fmt --check

      - name: Clippy
        working-directory: tools/cms-tui
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: tools/cms-tui
        run: cargo build

      - name: Test
        working-directory: tools/cms-tui
        run: cargo test

  # WHY a second Rust job rather than an extra step in the one above: the two
  # crates have different targets and different rebuild triggers, and the
  # ranking service is a server whose failure mode is an empty scoreboard in
  # front of an audience, so it earns its own signal.
  rust-ranking:
    name: Rust ranking (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.rust_ranking == 'true'
    # WHY a service: three tests in this crate need a database, and an ignored
    # test is a claim nobody checks. The service makes the SQL path real, so a
    # query that no longer matches the schema fails here instead of in a contest.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ranking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The failure counters live in Redis, as they do in the stack's own
      # redis-rate-limit service, so the counter tests need one too.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RANKING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ranking_test
      RANKING_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ranking-web/target
          key: ${{ runner.os }}-cargo-ranking-${{ hashFiles('ranking-web/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ranking-

      # Every ranking migration in timestamp order, so new ones auto-apply and the database
      # tests see a deployment's schema. The rehearsal applies the same set itself.
      - name: Apply the ranking migrations
        run: |
          for migration in admin-panel/prisma/migrations/*_ranking_*/; do
            psql "$RANKING_TEST_DATABASE_URL" -f "${migration}migration.sql"
          done

      - name: Format check
        working-directory: ranking-web
        run: cargo fmt --check

      - name: Clippy
        working-directory: ranking-web
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: ranking-web
        run: cargo test --all-targets -- --include-ignored

      # The tab bar's overflow rule and the views' aggregations are pure JavaScript with
      # no Rust counterpart, so they are exercised on their own rather than left to the
      # browser. Runs on the ranking paths filter this job already owns.
      # WHY a glob and not the directory: --test takes file paths or glob patterns, not a
      # bare directory — the runner's Node treats that as a module to load and fails with
      # "Cannot find module .../tests".
      - name: Perspective logic tests
        run: node --test "ranking-web/static/tests/*.test.js"

      # The rehearsal drives the release binary over HTTP against a database of its own:
      # this job's database already carries the schema, and these migrations are not
      # idempotent, so a second one is created instead of re-applying them. It is the
      # only place the whole surface — entity reads, byte framing, events, protected
      # mode — runs end to end against a real Postgres and Redis.
      - name: Build the release binary for the rehearsal
        working-directory: ranking-web
        run: cargo build --release

      - name: Acceptance rehearsal
        run: |
          psql "${RANKING_TEST_DATABASE_URL%/*}/postgres" -c 'CREATE DATABASE ranking_e2e' || true
          RANKING_E2E_DATABASE_URL="${RANKING_TEST_DATABASE_URL%/*}/ranking_e2e" \
          RANKING_E2E_REDIS_URL="${RANKING_TEST_REDIS_URL}" \
            bash ranking-web/tests/e2e/ranking_e2e.sh

  # WHY a job of its own: nothing in this repository read a Rust advisory, licence
  # or source policy. A CVE in a transitive crate, a copyleft licence that makes a
  # published image undistributable, or a crate resolved from a git fork could all
  # reach a release with every other job green. It is path-gated on the two Cargo
  # trees (and on deny.toml itself) so a panel-only PR never pays for it.
  deny:
    name: Advisories, licences, sources (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.rust_ranking == 'true' || needs.changes.outputs.rust_backend == 'true')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # WHY a pinned release binary and not `cargo install`: building it would add
      # minutes to every run and would float with whatever toolchain the runner
      # happens to have, so a new advisory-database format could break the gate
      # without anyone changing this repository. The tarball is checksummed.
      - name: Install cargo-deny 0.20.2
        run: |
          url=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o /tmp/cargo-deny.tar.gz "$url"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz" \
            | sha256sum --check --strict -
          tar xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
          cargo-deny --version

      # cargo-deny resolves the manifest from the working directory, so each tree is
      # checked from inside itself. --config is explicit and relative to that
      # directory: the policy lives at the root, and discovery walking up from a
      # workspace is exactly the failure mode that would let a crate ship unpoliced.
      - name: cargo-deny (ranking-web)
        if: needs.changes.outputs.rust_ranking == 'true'
        working-directory: ranking-web
        run: cargo-deny --config ../deny.toml --all-features check

      # WHY the lockfile check comes first: cargo-deny audits the graph a lockfile
      # pins. Without one it would resolve a fresh graph and report on a dependency
      # set nobody ships, which is worse than no gate because it looks like one.
      # A workspace that arrives with no committed lockfile fails here, by name.
      - name: cargo-deny (backend workspace)
        if: needs.changes.outputs.rust_backend == 'true'
        working-directory: backend
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::backend/Cargo.lock is missing — there is no graph to audit."
            echo "The workspace has no committed lockfile: commit one rather than skip this gate."
            exit 1
          fi
          cargo-deny --config ../deny.toml check

  # ./cms execs .tools/cms-tui/cms-tui-linux-<arch> before it will build from source,
  # so that checked-in binary is what an operator actually runs. Without this job it
  # stays at whatever the last person committed, and a merged change to the CLI looks
  # like it did nothing: the new flags are in the source and absent from the binary.
  release-binary:
    name: Refresh vendored cms-tui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.rust == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      # A static build, because the box it runs on may not have the same libc. The
      # repository's own .cargo/config.toml pins musl and strips, which is what makes
      # the committed binary reproducible enough to diff meaningfully.
      - name: Build release binary
        working-directory: tools/cms-tui
        run: cargo build --release

      - name: Install into .tools
        run: |
          install -Dm755 tools/cms-tui/target/x86_64-unknown-linux-musl/release/cms-tui \
            .tools/cms-tui/cms-tui-linux-x86_64
          .tools/cms-tui/cms-tui-linux-x86_64 domain --help >/dev/null

      # WHY the binary is committed rather than downloaded: `./cms` prefers it over a
      # local build, so removing it would make every operator without cargo fall back
      # to a bootstrap path that needs a toolchain they may not have.
      - name: Commit when the binary changed
        run: |
          if git diff --quiet -- .tools/cms-tui/; then
            echo "vendored binary already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tools/cms-tui/cms-tui-linux-x86_64
          # WHY the message lives in a variable: a multi-line string inside this block
          # scalar ends the YAML block early, and the workflow then fails to parse.
          msg="build(cms-tui): refresh the vendored binary

          ./cms runs this file before it builds from source, so a CLI change only
          reaches the operator once this binary is rebuilt."
          git commit -m "${msg}"
          git push

  # Each image builds as its own PARALLEL job (kept separate on purpose — the
  # images are large and serialising them would multiply wall-clock time).
  # Skipped areas show as skipped, not failed.
  build-and-push-core:
    name: Build core image
    needs: changes
    if: needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this job's OIDC token for a short-lived
      # Fulcio certificate. Nothing long-lived is stored.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # raphael.js is vendored in the repo; verify integrity instead of
      # fetching it at build time (no network dependency in the build).
      - name: Verify vendored ranking frontend assets
        run: |
          test -f ranking-web/static/lib/raphael.js || { echo "::error::ranking-web/static/lib/raphael.js is missing (expected vendor of https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js)"; exit 1; }
          echo "4da6e9aca75e3576d27ac0962ccadc6d6483cd486901d70d3dee50e77ae7f588  ranking-web/static/lib/raphael.js" | sha256sum --check --strict -

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for CMS Core
        id: meta-core
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'major/admin-panel' }}

      - name: Build and push CMS Core
        id: build-core
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
          # WHY: the registry keeps the build's own provenance (max detail) and
          # an SPDX SBOM beside the image, so what ships traces back to this run.
          provenance: mode=max
          sbom: true

      # Keyless signing: cosign exchanges this job's OIDC token for a short-lived
      # Fulcio certificate and pushes the signature to the registry, so no signing
      # key exists in this repository or in its secrets. The deploy path verifies
      # this signature against the identity/issuer below before it upgrades anything.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          # Pinned, so the binary that signs is the binary the deploy gate expects.
          cosign-release: 'v2.5.2'

      # Signs the DIGEST the build pushed, not the tag: a tag can be moved, a digest
      # cannot, and the deploy gate verifies exactly this digest.
      - name: Sign the pushed digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core
          DIGEST: ${{ steps.build-core.outputs.digest }}
        run: |
          test -n "${DIGEST}" || { echo "::error::the build step reported no digest — nothing to sign"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"

