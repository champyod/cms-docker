name: Secret scan

# WHY its own workflow and no path filters: the secrets in this repo's history lived in docs and
# runbooks, which lint.yml deliberately skips. A scan that inherits that filter scans nothing that
# matters, so this one runs on every push and pull request.
on:
  push:
    branches: ["main", "major/admin-panel"]
  pull_request:
    branches: ["main", "major/admin-panel"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scan reads history, not just the tip
      - name: Secret and deployment-address scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
