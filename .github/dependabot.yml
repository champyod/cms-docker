# Dependabot VERSION UPDATES are retired here — Renovate is the only bot that opens version
# PRs for this repo (see renovate.json at the repo root).
#
# WHY one bot: two bots open competing PRs for the same bump, each with its own grouping and
# schedule, and neither sees the other's open branch — the merge queue then churns on
# duplicates and a bump can land twice. Renovate also covers what Dependabot cannot see here:
# the docker-compose manager for docker-compose*.yml, which is where most of this repo's
# image pins live.
#
# SECURITY updates are NOT configured in this file: GitHub delivers those from the repo's
# Dependabot alerts / security-update settings, which stay enabled and are unaffected by the
# empty list below. This file only ever configured version updates.
version: 2
updates: []
